<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧰 工作小助手 V2.3</title>
<meta name="theme-color" content="#4B5320">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工作小助手">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE3; --bg-card:#FBF9F2; --bg-card2:#EFE9D8;
  --ink:#2B2E28; --ink-soft:#5B5F52; --ink-faint:#8B8C7F;
  --olive:#4B5320; --olive-dark:#343A16; --sage:#8A9A5B; --sage-light:#DCE3C6;
  --line:#DCD5BF;
  --red:#C1443C; --red-bg:#F5DEDB;
  --orange:#C97A20; --orange-bg:#F3E3CC;
  --yellow:#B08A1E; --yellow-bg:#F1E8C9;
  --green:#5C7A45; --green-bg:#E2E9D6;
  --white-bg:#EDEDE6;
  --outer:#DCD6C4;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',-apple-system,sans-serif;
  --serif:'Noto Serif TC',serif;
  --mono:'JetBrains Mono','Courier New',monospace;
  --shadow: 0 2px 0 rgba(43,46,40,0.06), 0 6px 14px rgba(43,46,40,0.08);
}
html[data-theme="dark"]{
  --bg:#1E211A; --bg-card:#262B1F; --bg-card2:#2E3426;
  --ink:#EDEADC; --ink-soft:#B7B9A8; --ink-faint:#7C7F6C;
  --olive:#8CA05A; --olive-dark:#5C6A2E; --sage:#8A9A5B; --sage-light:#3A4426;
  --line:#3A4030;
  --red:#E28880; --red-bg:#3A2320;
  --orange:#E0A868; --orange-bg:#3A2E18;
  --yellow:#DCC26C; --yellow-bg:#3A3418;
  --green:#93B77E; --green-bg:#20301E;
  --white-bg:#2A2C22;
  --outer:#101208;
  --shadow: 0 2px 0 rgba(0,0,0,0.2), 0 6px 14px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--outer);}
body{font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;min-height:100vh;transition:background .2s,color .2s;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--sage-light);}
#shell{width:100%;max-width:460px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.15);}
#app{flex:1;padding-bottom:90px;}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:16px 16px 10px 16px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line);}
.topbar .backbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);flex-shrink:0;}
.topbar .ttl{flex:1;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.5px;}
.topbar .datestamp{font-family:var(--mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--line);border-radius:6px;padding:3px 6px;flex-shrink:0;white-space:nowrap;}
.topbar .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

/* ---------- home ---------- */
.home-header{padding:20px 20px 14px 20px;background:linear-gradient(180deg,var(--olive) 0%, var(--olive-dark) 100%);color:#F3EFE3;border-radius:0 0 22px 22px;position:relative;overflow:hidden;}
.home-header::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);pointer-events:none;}
.home-toprow{position:relative;z-index:1;}
.home-toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.home-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);padding:3px 9px;border-radius:100px;letter-spacing:1px;}
.interrupt-btn{font-family:var(--mono);font-size:11px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#F3EFE3;padding:5px 10px;border-radius:100px;}
.home-title{font-family:var(--serif);font-weight:900;font-size:23px;margin:0 0 6px 0;letter-spacing:.5px;}
.home-sub{font-size:13px;color:#DCE3C6;margin:0;line-height:1.5;}
.oneliner{margin:12px 16px 0 16px;background:var(--bg-card);border:1px solid var(--line);border-left:4px solid var(--olive);border-radius:12px;padding:11px 14px;font-size:13px;color:var(--ink-soft);box-shadow:var(--shadow);}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 14px 0 14px;}
.board-tile{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:9px 2px 7px 2px;text-align:center;box-shadow:var(--shadow);}
.board-tile .n{font-family:var(--mono);font-weight:700;font-size:18px;line-height:1.1;}
.board-tile .l{font-size:10px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;}
.board-tile.red .n{color:var(--red);}
.board-tile.orange .n{color:var(--orange);}
.board-tile.yellow .n{color:var(--yellow);}
.board-tile.green .n{color:var(--green);}

.entrygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;}
.entrybtn{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;}
.entrybtn .emoji{font-size:26px;}
.entrybtn .lbl{font-weight:700;font-size:14px;}
.entrybtn .desc{font-size:11px;color:var(--ink-soft);line-height:1.4;}
.entrybtn.primary{background:var(--olive);color:#fff;border-color:var(--olive-dark);}
.entrybtn.primary .desc{color:#DCE3C6;}
.entrybtn.adhoc{background:var(--orange-bg);border-color:var(--orange);}

.section-label{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--ink-faint);text-transform:uppercase;padding:0 16px;margin:14px 0 8px 0;}
.linkrow{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;margin:0 16px 8px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:700;}
.linkrow .arrow{color:var(--ink-faint);font-weight:400;}
.linkrow .sub{font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:2px;}

/* ---------- cards / task list ---------- */
.bucket-head{display:flex;align-items:center;gap:8px;padding:14px 16px 6px 16px;font-weight:700;font-size:13px;}
.bucket-count{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
.tasklist{padding:0 12px;display:flex;flex-direction:column;gap:8px;}
.taskcard{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 14px;box-shadow:var(--shadow);position:relative;border-left:5px solid var(--sage);}
.taskcard.b-red{border-left-color:var(--red);}
.taskcard.b-orange{border-left-color:var(--orange);}
.taskcard.b-yellow{border-left-color:var(--yellow);}
.taskcard.b-green{border-left-color:var(--green);}
.taskcard.b-white{border-left-color:var(--ink-faint);}
.taskcard.overdue{background:var(--red-bg);}
.taskcard .content{font-weight:700;font-size:14.5px;line-height:1.4;margin-bottom:6px;}
.taskcard .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--ink-soft);align-items:center;}
.taskcard .remain{font-family:var(--mono);font-size:11px;font-weight:700;}
.taskcard .remain.over{color:var(--red);}
.overdue-flag{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:700;margin-bottom:6px;}
.followup-flag{display:inline-flex;align-items:center;gap:4px;background:var(--orange);color:#fff;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:700;margin-bottom:6px;}
.tag{background:var(--bg-card2);border-radius:100px;padding:2px 8px;font-size:11px;white-space:nowrap;}
.statuspill{display:inline-flex;align-items:center;gap:4px;border-radius:100px;padding:2px 8px;font-size:11px;font-weight:700;}
.statuspill.done{background:var(--green-bg);color:var(--green);}
.statuspill.inprogress{background:var(--yellow-bg);color:var(--yellow);}
.statuspill.waiting{background:var(--orange-bg);color:var(--orange);}
.statuspill.problem{background:var(--red-bg);color:var(--red);}
.statuspill.notstarted{background:var(--white-bg);color:var(--ink-soft);}
.timerpill{background:var(--sage-light);color:var(--olive-dark);border-radius:100px;padding:2px 8px;font-size:11px;font-weight:700;font-family:var(--mono);}

.empty{text-align:center;padding:36px 24px;color:var(--ink-faint);font-size:13px;line-height:1.7;}
.empty .e{font-size:34px;display:block;margin-bottom:10px;}

/* ---------- next-up strip ---------- */
.nextup{margin:14px 12px 4px 12px;background:var(--olive-dark);border-radius:16px;padding:14px 14px 10px 14px;color:#F3EFE3;}
.nextup .h{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:#B9C79A;margin-bottom:8px;display:flex;justify-content:space-between;}
.nextup-item{background:rgba(255,255,255,0.08);border-radius:10px;padding:10px 10px;margin-bottom:6px;font-size:13px;}
.nextup-item .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.nextup-item .t{font-weight:700;flex:1;}
.nextup-item .arrow{opacity:.6;}
.nextup-item .row2{display:flex;gap:8px;margin-top:6px;font-size:11px;color:#C9D2B0;font-family:var(--mono);}
.nextup-item .startbtn{margin-top:8px;width:100%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;padding:8px;font-size:12px;font-weight:700;}
.nextup-more{text-align:center;font-size:12px;color:#C9D2B0;padding:4px 0 2px 0;}

/* ---------- forms ---------- */
.formwrap{padding:14px 16px 30px 16px;}
.field{margin-bottom:18px;}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:8px;color:var(--ink);}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:6px;}
textarea, input[type=text], input[type=time], input[type=date], input[type=datetime-local], select{width:100%;background:var(--bg-card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);resize:vertical;}
textarea:focus, input:focus, select:focus{outline:none;border-color:var(--olive);}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;}
.chiprow.scrollx{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
.chiprow.scrollx::-webkit-scrollbar{display:none;}
.chip{border:1.5px solid var(--line);background:var(--bg-card);border-radius:100px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--olive);border-color:var(--olive-dark);color:#fff;}
.chip.active.red{background:var(--red);border-color:var(--red);}
.chip.active.orange{background:var(--orange);border-color:var(--orange);}
.chip.active.yellow{background:var(--yellow);border-color:var(--yellow);}
.chip.active.green{background:var(--green);border-color:var(--green);}
.chip.small{padding:6px 12px;font-size:12px;}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tplbtn{background:var(--bg-card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-size:12.5px;font-weight:700;text-align:center;}

.bigbtn{width:100%;background:var(--olive);color:#fff;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--olive-dark);margin-top:6px;min-height:44px;}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--olive-dark);}
.bigbtn.secondary{background:var(--bg-card);color:var(--olive-dark);border:1.5px solid var(--olive);box-shadow:none;}
.bigbtn.outline{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);box-shadow:none;}
.bigbtn.danger{background:var(--red);box-shadow:0 4px 0 #8a2f29;}
.bigbtn.small{padding:11px;font-size:13px;box-shadow:none;}

/* ---------- report result ---------- */
.reportbox{background:var(--bg-card2);border:1.5px dashed var(--olive);border-radius:14px;padding:16px;font-size:14.5px;line-height:1.8;margin-top:10px;white-space:pre-wrap;}
.reportbox-label{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:8px;letter-spacing:1px;}
.tonetabs{display:flex;gap:6px;margin-top:12px;}
.tonetab{flex:1;text-align:center;padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg-card);font-size:12px;font-weight:700;color:var(--ink-soft);}
.tonetab.active{background:var(--olive);border-color:var(--olive-dark);color:#fff;}

/* ---------- task detail ---------- */
.detailhead{padding:16px;}
.detailhead .content{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.5;margin-bottom:10px;}
.detailmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
.detailnote{background:var(--bg-card2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink-soft);margin-top:8px;}
.detailblock{padding:6px 16px 16px 16px;}
.detailblock .h{font-weight:700;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.loglist{display:flex;flex-direction:column;gap:0;}
.logline{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line);}
.logline:last-child{border-bottom:none;}
.logline .time{font-family:var(--mono);color:var(--ink-faint);flex-shrink:0;}
.logline .desc{color:var(--ink);}
.reportlogitem{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;line-height:1.6;}
.reportlogitem .time{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-bottom:4px;}
.timerbox{background:var(--bg-card2);border-radius:12px;padding:14px;text-align:center;}
.timerbox .big{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--olive-dark);}
.timerbox .lbl{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.actionrow{display:flex;gap:8px;margin-top:12px;}
.actionrow .bigbtn{margin-top:0;}
.waitpanel{background:var(--orange-bg);border-radius:12px;padding:12px;margin-top:10px;}
.followup-banner{background:var(--red);color:#fff;border-radius:12px;padding:12px 14px;margin:0 16px 10px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* ---------- boss screen ---------- */
.bosslist{padding:10px 12px;display:flex;flex-direction:column;gap:8px;}
.bossline{background:var(--bg-card);border:1px solid var(--line);border-left:5px solid var(--olive);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.bossline.special{border-left-color:var(--red);}
.bossline .q{font-weight:700;font-size:14px;}
.bosslinenum{font-family:var(--mono);font-size:11px;color:var(--ink-faint);}
.bossquote{background:var(--olive-dark);color:#F3EFE3;border-radius:14px;padding:16px;margin:12px 16px;font-family:var(--serif);font-size:16px;line-height:1.6;}
.bossquote::before{content:"「";} .bossquote::after{content:"」";}
.think-block{background:var(--bg-card2);border-radius:12px;padding:14px;margin:0 16px 12px 16px;font-size:13.5px;line-height:1.7;}
.reply-block{background:var(--bg-card);border:1.5px dashed var(--sage);border-radius:12px;padding:14px;margin:0 16px 12px 16px;font-size:14.5px;line-height:1.8;}
.blocklabel{font-weight:700;font-size:12.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.legendbox{background:var(--bg-card2);border-radius:12px;padding:12px 14px;margin:0 16px 12px 16px;font-size:13px;line-height:2;}
.legendbox b{font-family:var(--mono);}

/* ---------- relax ---------- */
.moodgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 16px 16px;}
.moodbtn{background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);}
.moodbtn .e{font-size:30px;display:block;margin-bottom:6px;}
.moodbtn .l{font-weight:700;font-size:13px;}
.relax-full{min-height:100vh;background:radial-gradient(circle at 50% 30%, #5C6A2E 0%, #343A16 70%);color:#F3EFE3;display:flex;flex-direction:column;align-items:center;padding:36px 24px;}
.relax-stage{font-size:16px;color:#F3EFE3;text-align:center;margin-bottom:20px;line-height:1.8;min-height:50px;font-weight:700;}
.breathe-count{font-family:var(--mono);font-size:38px;font-weight:700;margin-bottom:4px;}
.breathe-sub{font-family:var(--mono);font-size:12px;color:#B9C79A;margin-bottom:20px;}
.breathe-circle{width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), rgba(255,255,255,0.05) 70%);border:2px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;transform:scale(0.75);transition:transform 4s ease-in-out;margin:6px 0 20px 0;}
.breathe-circle.exhale{transform:scale(1.05);transition:transform 6s ease-in-out;}
.breathe-phase{font-family:var(--serif);font-size:15px;font-weight:700;}
.relax-cancel{background:transparent;border:none;color:#DCE3C6;font-size:13px;text-decoration:underline;margin-top:6px;}
.relax-done-icon{font-size:44px;margin-bottom:14px;}
.relax-done-msg{font-size:16px;line-height:2;text-align:center;margin-bottom:26px;}

/* ---------- modal / overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,22,15,0.55);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.overlay .sheet{width:100%;max-width:460px;background:var(--bg-card);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;max-height:85vh;overflow-y:auto;}
.overlay.center{align-items:center;padding:24px;}
.overlay.center .sheet{border-radius:18px;}
.sheet-title{font-family:var(--serif);font-weight:700;font-size:18px;margin-bottom:10px;}
.sheet-text{font-size:13.5px;line-height:1.9;color:var(--ink-soft);margin-bottom:16px;}
.quickmenu-item{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;}
.quickmenu-item:last-child{border-bottom:none;}
.quickmenu-item .e{font-size:20px;}

.fab{position:fixed;right:max(16px, calc(50vw - 214px));bottom:82px;width:52px;height:52px;border-radius:50%;background:var(--olive);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.3);z-index:40;border:none;}

.completeflash{position:fixed;inset:0;z-index:300;background:rgba(92,122,69,0.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;font-weight:700;gap:10px;animation:flashfade 0.9s ease forwards;pointer-events:none;}
@keyframes flashfade{0%{opacity:0;}15%{opacity:1;}75%{opacity:1;}100%{opacity:0;}}

/* ---------- bottom nav ---------- */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--bg-card);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom)) 4px;z-index:30;}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--ink-faint);background:transparent;border:none;min-height:44px;}
.navbtn .e{font-size:19px;}
.navbtn .l{font-size:10px;font-weight:600;}
.navbtn.active{color:var(--olive);background:var(--sage-light);}

/* ---------- misc ---------- */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:100px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:all .25s ease;white-space:nowrap;max-width:90%;text-overflow:ellipsis;overflow:hidden;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.gap{height:14px;}

{"id": "eng_000155", "type": "phrase", "category": "phrase", "en": "I disagree.", "zh": "我不同意。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000156", "type": "phrase", "category": "phrase", "en": "That's true.", "zh": "那是真的。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000157", "type": "phrase", "category": "phrase", "en": "That's not true.", "zh": "那不是真的。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000158", "type": "phrase", "category": "phrase", "en": "It depends.", "zh": "要看情況。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000159", "type": "phrase", "category": "phrase", "en": "It's up to you.", "zh": "由你決定。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000160", "type": "phrase", "category": "phrase", "en": "Whatever you say.", "zh": "你說了算。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000161", "type": "phrase", "category": "phrase", "en": "I trust you.", "zh": "我相信你。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000162", "type": "phrase", "category": "phrase", "en": "I need your advice.", "zh": "我需要你的建議。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000163", "type": "phrase", "category": "phrase", "en": "Can I ask you something?", "zh": "我可以問你一件事嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000164", "type": "phrase", "category": "phrase", "en": "Of course.", "zh": "當然。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000165", "type": "phrase", "category": "phrase", "en": "Absolutely.", "zh": "完全同意。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000166", "type": "phrase", "category": "phrase", "en": "Not really.", "zh": "不太是。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000167", "type": "phrase", "category": "phrase", "en": "I'm not in the mood.", "zh": "我現在沒心情。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000168", "type": "phrase", "category": "phrase", "en": "Let's talk later.", "zh": "我們晚點聊。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000169", "type": "phrase", "category": "phrase", "en": "I'll text you.", "zh": "我會傳訊息給你。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000170", "type": "phrase", "category": "phrase", "en": "Call me anytime.", "zh": "隨時打給我。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000171", "type": "phrase", "category": "phrase", "en": "Answer the phone, please.", "zh": "請接電話。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000172", "type": "phrase", "category": "phrase", "en": "The line is busy.", "zh": "電話忙線中。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000173", "type": "phrase", "category": "phrase", "en": "Please leave a message.", "zh": "請留言。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000174", "type": "phrase", "category": "phrase", "en": "I missed your call.", "zh": "我沒接到你的電話。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000175", "type": "dialogue", "category": "food", "en": "A: Are you hungry?\nB: Yes, a little.", "zh": "A：你餓了嗎？\nB：對，有一點。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000176", "type": "dialogue", "category": "food", "en": "A: What do you want to eat?\nB: Anything is fine.", "zh": "A：你想吃什麼？\nB：什麼都可以。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000177", "type": "dialogue", "category": "food", "en": "A: Is this seat taken?\nB: No, please sit down.", "zh": "A：這個位子有人坐嗎？\nB：沒有，請坐。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000178", "type": "dialogue", "category": "food", "en": "A: How is the food?\nB: It's really good.", "zh": "A：食物好吃嗎？\nB：真的很好吃。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000179", "type": "dialogue", "category": "shopping", "en": "A: How much is this?\nB: It's 500 dollars.", "zh": "A：這個多少錢？\nB：五百元。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000180", "type": "dialogue", "category": "shopping", "en": "A: Do you have this in a smaller size?\nB: Let me check.", "zh": "A：有小一點的尺寸嗎？\nB：我去確認一下。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000181", "type": "dialogue", "category": "shopping", "en": "A: Can I try this on?\nB: Sure, the fitting room is over there.", "zh": "A：我可以試穿嗎？\nB：可以，試衣間在那邊。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000182", "type": "dialogue", "category": "shopping", "en": "A: I'll take this one.\nB: Great choice.", "zh": "A：我要買這個。\nB：很棒的選擇。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000183", "type": "dialogue", "category": "transport", "en": "A: Where is the bus stop?\nB: It's right around the corner.", "zh": "A：公車站在哪裡？\nB：就在轉角那邊。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000184", "type": "dialogue", "category": "transport", "en": "A: Does this bus go downtown?\nB: Yes, it does.", "zh": "A：這班公車有到市區嗎？\nB：有的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000185", "type": "dialogue", "category": "transport", "en": "A: How long does it take?\nB: About twenty minutes.", "zh": "A：要花多久時間？\nB：大概二十分鐘。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000186", "type": "dialogue", "category": "transport", "en": "A: Can you take me to this address?\nB: Sure, get in.", "zh": "A：你可以載我到這個地址嗎？\nB：好，請上車。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000187", "type": "dialogue", "category": "work", "en": "A: Can we talk for a minute?\nB: Sure, what's up?", "zh": "A：我們可以聊一下嗎？\nB：好啊，怎麼了？", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000188", "type": "dialogue", "category": "work", "en": "A: When is this due?\nB: By Friday.", "zh": "A：這個什麼時候要交？\nB：星期五之前。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000189", "type": "dialogue", "category": "work", "en": "A: I finished the report.\nB: Great, thank you.", "zh": "A：我完成報告了。\nB：太好了，謝謝你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000190", "type": "dialogue", "category": "work", "en": "A: Can you send me the file?\nB: Sure, I'll send it now.", "zh": "A：你可以把檔案寄給我嗎？\nB：好，我現在寄。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000191", "type": "dialogue", "category": "phone", "en": "A: Hello, who is this?\nB: This is John.", "zh": "A：喂，請問是哪位？\nB：我是約翰。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000192", "type": "dialogue", "category": "phone", "en": "A: Is he available now?\nB: He's in a meeting.", "zh": "A：他現在方便嗎？\nB：他正在開會。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000193", "type": "dialogue", "category": "phone", "en": "A: Can I leave a message?\nB: Sure, go ahead.", "zh": "A：我可以留言嗎？\nB：可以，請說。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000194", "type": "dialogue", "category": "phone", "en": "A: I'll call you back later.\nB: Okay, talk to you soon.", "zh": "A：我等一下回電給你。\nB：好，再聊。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000195", "type": "dialogue", "category": "social", "en": "A: How have you been?\nB: Pretty good, thanks.", "zh": "A：你最近好嗎？\nB：還不錯，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000196", "type": "dialogue", "category": "social", "en": "A: Do you have plans tonight?\nB: Not yet.", "zh": "A：你今晚有計畫嗎？\nB：還沒有。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000197", "type": "dialogue", "category": "social", "en": "A: Would you like to join us?\nB: I'd love to.", "zh": "A：你想加入我們嗎？\nB：我很樂意。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000198", "type": "dialogue", "category": "social", "en": "A: It was nice talking to you.\nB: You too, take care.", "zh": "A：很高興跟你聊天。\nB：我也是，保重。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000199", "type": "dialogue", "category": "travel", "en": "A: Where are you from?\nB: I'm from Taiwan.", "zh": "A：你來自哪裡？\nB：我來自台灣。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000200", "type": "dialogue", "category": "travel", "en": "A: How long are you staying?\nB: For a week.", "zh": "A：你會待多久？\nB：一個星期。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000201", "type": "dialogue", "category": "travel", "en": "A: Do you have a map?\nB: Yes, here you go.", "zh": "A：你有地圖嗎？\nB：有，給你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000202", "type": "dialogue", "category": "travel", "en": "A: Is it far from here?\nB: Not really, just ten minutes.", "zh": "A：離這裡遠嗎？\nB：不遠，走路十分鐘。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000203", "type": "dialogue", "category": "health", "en": "A: Are you okay?\nB: I don't feel well.", "zh": "A：你還好嗎？\nB：我覺得不太舒服。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000204", "type": "dialogue", "category": "health", "en": "A: What's wrong?\nB: I have a headache.", "zh": "A：怎麼了？\nB：我頭痛。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000205", "type": "dialogue", "category": "health", "en": "A: You should see a doctor.\nB: I will.", "zh": "A：你應該去看醫生。\nB：我會的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000206", "type": "dialogue", "category": "health", "en": "A: Take some rest.\nB: I will, thank you.", "zh": "A：好好休息一下。\nB：我會的，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000207", "type": "dialogue", "category": "cafe", "en": "A: What would you like to drink?\nB: A coffee, please.", "zh": "A：你想喝什麼？\nB：一杯咖啡，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "咖啡店"},
{"id": "eng_000208", "type": "dialogue", "category": "cafe", "en": "A: For here or to go?\nB: To go, please.", "zh": "A：內用還是外帶？\nB：外帶，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "咖啡店"},
{"id": "eng_000209", "type": "dialogue", "category": "cafe", "en": "A: Would you like some sugar?\nB: No sugar, thanks.", "zh": "A：要加糖嗎？\nB：不用，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "咖啡店"},
{"id": "eng_000210", "type": "dialogue", "category": "hotel", "en": "A: I have a reservation.\nB: May I have your name?", "zh": "A：我有訂房。\nB：請問您的姓名？", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "飯店"},
{"id": "eng_000211", "type": "dialogue", "category": "hotel", "en": "A: What time is check-out?\nB: Eleven in the morning.", "zh": "A：退房時間是幾點？\nB：早上十一點。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "飯店"},
{"id": "eng_000212", "type": "dialogue", "category": "hotel", "en": "A: Can I get an extra towel?\nB: Sure, right away.", "zh": "A：可以多給我一條毛巾嗎？\nB：可以，馬上來。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "飯店"},
{"id": "eng_000213", "type": "dialogue", "category": "direction", "en": "A: Excuse me, where is the station?\nB: Go straight and turn left.", "zh": "A：不好意思，車站在哪裡？\nB：直走然後左轉。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "問路"},
{"id": "eng_000214", "type": "dialogue", "category": "direction", "en": "A: Is it within walking distance?\nB: Yes, about five minutes.", "zh": "A：走路到得了嗎？\nB：可以，大概五分鐘。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "問路"},
{"id": "eng_000215", "type": "dialogue", "category": "money", "en": "A: Can I pay by card?\nB: Yes, we accept cards.", "zh": "A：可以刷卡嗎？\nB：可以，我們接受刷卡。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "金錢"},
{"id": "eng_000216", "type": "dialogue", "category": "money", "en": "A: Do you have change?\nB: Let me check.", "zh": "A：你有零錢嗎？\nB：我看看。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "金錢"},
{"id": "eng_000217", "type": "dialogue", "category": "schedule", "en": "A: Are you free tomorrow?\nB: Yes, I am.", "zh": "A：你明天有空嗎？\nB：有，我有空。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "約時間"},
{"id": "eng_000218", "type": "dialogue", "category": "schedule", "en": "A: Let's meet at three.\nB: Sounds good.", "zh": "A：我們三點見面吧。\nB：聽起來不錯。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "約時間"},
{"id": "eng_000219", "type": "dialogue", "category": "chat", "en": "A: What did you do today?\nB: Nothing much.", "zh": "A：你今天做了什麼？\nB：沒什麼特別的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "日常聊天"},
{"id": "eng_000220", "type": "dialogue", "category": "chat", "en": "A: How's the weather today?\nB: It's a bit cold.", "zh": "A：今天天氣如何？\nB：有點冷。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "日常聊天"},
{"id": "eng_000221", "type": "dialogue", "category": "shopping", "en": "A: Can I get a bag?\nB: Sure, here you go.", "zh": "A：可以給我一個袋子嗎？\nB：可以，給你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000222", "type": "dialogue", "category": "shopping", "en": "A: Do you accept returns?\nB: Yes, within seven days.", "zh": "A：可以退貨嗎？\nB：可以，七天內。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "購物"},
{"id": "eng_000223", "type": "dialogue", "category": "food", "en": "A: Can I get the menu?\nB: Sure, here it is.", "zh": "A：可以給我菜單嗎？\nB：可以，這是菜單。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000224", "type": "dialogue", "category": "food", "en": "A: Is this dish spicy?\nB: A little bit.", "zh": "A：這道菜辣嗎？\nB：有一點辣。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "吃飯"},
{"id": "eng_000225", "type": "dialogue", "category": "transport", "en": "A: Which exit should I take?\nB: Exit two.", "zh": "A：我該走哪個出口？\nB：二號出口。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000226", "type": "dialogue", "category": "transport", "en": "A: Is this seat empty?\nB: Yes, please sit.", "zh": "A：這個位子是空的嗎？\nB：是的，請坐。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "交通"},
{"id": "eng_000227", "type": "dialogue", "category": "work", "en": "A: Can we push the meeting?\nB: Sure, what time works?", "zh": "A：我們可以延後會議嗎？\nB：可以，什麼時間方便？", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000228", "type": "dialogue", "category": "work", "en": "A: Did you get my email?\nB: Yes, I did.", "zh": "A：你收到我的信了嗎？\nB：收到了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "工作"},
{"id": "eng_000229", "type": "dialogue", "category": "phone", "en": "A: Can you hear me?\nB: Yes, loud and clear.", "zh": "A：你聽得到我嗎？\nB：聽得很清楚。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000230", "type": "dialogue", "category": "phone", "en": "A: The signal is bad.\nB: Let me call you back.", "zh": "A：訊號不好。\nB：我等一下回電給你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "電話"},
{"id": "eng_000231", "type": "dialogue", "category": "social", "en": "A: Can I sit here?\nB: Sure, go ahead.", "zh": "A：我可以坐這裡嗎？\nB：可以，請坐。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000232", "type": "dialogue", "category": "social", "en": "A: Are you new here?\nB: Yes, it's my first day.", "zh": "A：你是新來的嗎？\nB：對，我第一天上班。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "人際"},
{"id": "eng_000233", "type": "dialogue", "category": "travel", "en": "A: Can you recommend a good restaurant?\nB: This one nearby is great.", "zh": "A：你可以推薦好吃的餐廳嗎？\nB：附近這家很不錯。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000234", "type": "dialogue", "category": "travel", "en": "A: Is there a discount for students?\nB: Yes, with a student ID.", "zh": "A：學生有優惠嗎？\nB：有的，出示學生證即可。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "旅行"},
{"id": "eng_000235", "type": "dialogue", "category": "health", "en": "A: Do you have a fever?\nB: I think so.", "zh": "A：你有發燒嗎？\nB：我覺得有。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000236", "type": "dialogue", "category": "health", "en": "A: Take this medicine after meals.\nB: Okay, thank you.", "zh": "A：飯後吃這個藥。\nB：好的，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "基本健康"},
{"id": "eng_000237", "type": "dialogue", "category": "cafe", "en": "A: Hot or iced?\nB: Iced, please.", "zh": "A：要熱的還是冰的？\nB：冰的，謝謝。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "咖啡店"},
{"id": "eng_000238", "type": "dialogue", "category": "hotel", "en": "A: Is there a pool?\nB: Yes, on the third floor.", "zh": "A：有游泳池嗎？\nB：有，在三樓。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "飯店"},
{"id": "eng_000239", "type": "dialogue", "category": "direction", "en": "A: Is there a shortcut?\nB: Yes, through the park.", "zh": "A：有捷徑嗎？\nB：有，穿過公園就到了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "問路"},
{"id": "eng_000240", "type": "dialogue", "category": "money", "en": "A: Can you break this bill?\nB: Let me check.", "zh": "A：你可以找開這張鈔票嗎？\nB：我看看。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "金錢"},
{"id": "eng_000241", "type": "dialogue", "category": "schedule", "en": "A: Can we push it to next week?\nB: Sure, that works.", "zh": "A：我們可以延到下週嗎？\nB：可以，這樣沒問題。", "pron": "", "exEn": "", "exZh": "", "diff": "medium", "catLabel": "約時間"},
{"id": "eng_000242", "type": "qa", "category": "qa", "en": "How are you?\nI'm good. / I'm tired. / I'm fine. / I'm a little busy.", "zh": "你好嗎？\n我很好。 / 我累了。 / 我很好。 / 我有點忙。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000243", "type": "qa", "category": "qa", "en": "What's your name?\nMy name is Amy. / I'm Amy. / You can call me Amy.", "zh": "你叫什麼名字？\n我的名字是艾咪。 / 我是艾咪。 / 你可以叫我艾咪。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000244", "type": "qa", "category": "qa", "en": "Where are you going?\nI'm going home. / I'm going to work. / I'm going out.", "zh": "你要去哪裡？\n我要回家。 / 我要去上班。 / 我要出門。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000245", "type": "qa", "category": "qa", "en": "What do you do?\nI'm a teacher. / I work in an office. / I'm a student.", "zh": "你的工作是什麼？\n我是老師。 / 我在辦公室工作。 / 我是學生。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000246", "type": "qa", "category": "qa", "en": "Are you free tonight?\nYes, I am. / Sorry, I'm busy. / Maybe later.", "zh": "你今晚有空嗎？\n有，我有空。 / 抱歉，我很忙。 / 也許晚一點。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000247", "type": "qa", "category": "qa", "en": "Do you need help?\nYes, please. / No, I'm fine. / A little bit.", "zh": "你需要幫忙嗎？\n需要，謝謝。 / 不用，我可以。 / 需要一點點。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000248", "type": "qa", "category": "qa", "en": "Is this seat taken?\nNo, go ahead. / Yes, sorry. / I'm not sure.", "zh": "這個位子有人坐嗎？\n沒有，請坐。 / 有，抱歉。 / 我不確定。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000249", "type": "qa", "category": "qa", "en": "What time do you get off work?\nAt six. / Around five thirty. / I'm not sure yet.", "zh": "你幾點下班？\n六點。 / 大概五點半。 / 還不確定。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000250", "type": "qa", "category": "qa", "en": "Can I get a receipt?\nSure, here you go. / Of course. / One moment, please.", "zh": "可以給我收據嗎？\n當然，給你。 / 當然。 / 請稍等。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000251", "type": "qa", "category": "qa", "en": "How much do I owe you?\nIt's 300 dollars. / No charge. / Let me check.", "zh": "我要付多少錢？\n三百元。 / 不用付。 / 我來確認一下。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000252", "type": "qa", "category": "qa", "en": "Do you speak English?\nA little. / Yes, I do. / Not really.", "zh": "你會說英文嗎？\n會一點。 / 會的。 / 不太會。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000253", "type": "qa", "category": "qa", "en": "What's wrong?\nNothing, I'm fine. / I have a headache. / I'm just tired.", "zh": "怎麼了？\n沒事，我很好。 / 我頭痛。 / 只是累了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000254", "type": "qa", "category": "qa", "en": "Did you eat yet?\nYes, I did. / Not yet. / I'm eating now.", "zh": "你吃過了嗎？\n吃過了。 / 還沒。 / 我正在吃。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000255", "type": "qa", "category": "qa", "en": "Can you come with me?\nSure, let's go. / Sorry, I can't. / Give me a minute.", "zh": "你可以跟我一起去嗎？\n好，我們走吧。 / 抱歉，我不行。 / 等我一下。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000256", "type": "qa", "category": "qa", "en": "Where is the bathroom?\nIt's over there. / Down the hall. / I'm not sure.", "zh": "廁所在哪裡？\n在那邊。 / 走廊那頭。 / 我不確定。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000257", "type": "qa", "category": "qa", "en": "What's your phone number?\nIt's 0912-345-678. / I'll text it to you. / Let me write it down.", "zh": "你的電話號碼是？\n是0912-345-678。 / 我傳訊息給你。 / 我寫下來給你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000258", "type": "qa", "category": "qa", "en": "Do you have any questions?\nNo, I'm good. / Yes, one question. / Not right now.", "zh": "你有任何問題嗎？\n沒有，我可以了。 / 有，一個問題。 / 現在沒有。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000259", "type": "qa", "category": "qa", "en": "Is it far from here?\nNo, it's close. / Yes, quite far. / About ten minutes.", "zh": "離這裡遠嗎？\n不遠。 / 滿遠的。 / 大概十分鐘。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000260", "type": "qa", "category": "qa", "en": "Can you say that again?\nSure, no problem. / Of course. / Let me repeat it.", "zh": "你可以再說一次嗎？\n當然，沒問題。 / 可以。 / 我再說一次。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000261", "type": "qa", "category": "qa", "en": "What do you recommend?\nThis one is popular. / I like this one. / Try the special.", "zh": "你推薦什麼？\n這個很受歡迎。 / 我喜歡這個。 / 試試招牌吧。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000262", "type": "qa", "category": "qa", "en": "How was your weekend?\nIt was great. / Pretty relaxing. / Just okay.", "zh": "你的週末過得如何？\n很棒。 / 滿放鬆的。 / 還好。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000263", "type": "qa", "category": "qa", "en": "Are you okay?\nYes, I'm fine. / Not really. / I'll be okay.", "zh": "你還好嗎？\n我很好。 / 不太好。 / 我會沒事的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000264", "type": "qa", "category": "qa", "en": "What time does it open?\nAt nine. / In the morning. / I'm not sure.", "zh": "幾點開門？\n九點。 / 早上。 / 我不確定。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000265", "type": "qa", "category": "qa", "en": "Do you have this in another color?\nYes, we do. / Let me check. / Sorry, we don't.", "zh": "有其他顏色嗎？\n有的。 / 我確認一下。 / 抱歉，沒有。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000266", "type": "qa", "category": "qa", "en": "Can I get a discount?\nLet me ask. / Sorry, no discount today. / I'll check for you.", "zh": "可以打折嗎？\n我問問看。 / 抱歉，今天沒有折扣。 / 我幫你確認。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000267", "type": "qa", "category": "qa", "en": "What's the wifi password?\nIt's on the receipt. / Let me write it down. / It's 12345678.", "zh": "wifi密碼是什麼？\n在收據上。 / 我寫給你。 / 是12345678。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000268", "type": "qa", "category": "qa", "en": "Can you turn down the music?\nSure, sorry. / Of course. / No problem.", "zh": "可以把音樂關小聲嗎？\n好，抱歉。 / 當然可以。 / 沒問題。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000269", "type": "qa", "category": "qa", "en": "Is breakfast included?\nYes, it is. / No, it's extra. / Let me check.", "zh": "有包含早餐嗎？\n有的。 / 沒有，要另外付費。 / 我確認一下。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000270", "type": "qa", "category": "qa", "en": "What platform does the train leave from?\nPlatform three. / I'm not sure, let's check. / It's on the board.", "zh": "火車從哪個月台出發？\n三號月台。 / 我不確定，查一下。 / 看板上有寫。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000271", "type": "qa", "category": "qa", "en": "Can I reschedule?\nSure, when works for you? / Let me check the calendar. / No problem.", "zh": "可以改時間嗎？\n可以，你什麼時候方便？ / 我看一下行事曆。 / 沒問題。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000272", "type": "work", "category": "work", "en": "I'll check it.", "zh": "我會確認的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000273", "type": "work", "category": "work", "en": "I'll do it later.", "zh": "我等一下做。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000274", "type": "work", "category": "work", "en": "Give me a minute.", "zh": "給我一分鐘。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000275", "type": "work", "category": "work", "en": "I'm working on it.", "zh": "我正在處理。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000276", "type": "work", "category": "work", "en": "I need some help.", "zh": "我需要一些幫忙。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000277", "type": "work", "category": "work", "en": "I'm not sure.", "zh": "我不確定。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000278", "type": "work", "category": "work", "en": "Let me think.", "zh": "讓我想想。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000279", "type": "work", "category": "work", "en": "Can we reschedule?", "zh": "我們可以改時間嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000280", "type": "work", "category": "work", "en": "I'll send it right away.", "zh": "我馬上寄出。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000281", "type": "work", "category": "work", "en": "Let's touch base tomorrow.", "zh": "我們明天再聯繫一下。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000282", "type": "work", "category": "work", "en": "I'm running a bit late.", "zh": "我會晚一點到。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000283", "type": "work", "category": "work", "en": "Thanks for your patience.", "zh": "謝謝你的耐心等候。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000284", "type": "work", "category": "work", "en": "Let me get back to you.", "zh": "讓我之後回覆你。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000285", "type": "work", "category": "work", "en": "I appreciate your help.", "zh": "謝謝你的幫忙。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000286", "type": "work", "category": "work", "en": "Could you clarify that?", "zh": "你可以說明清楚一點嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000287", "type": "work", "category": "work", "en": "I'll follow up on this.", "zh": "我會追蹤這件事。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000288", "type": "work", "category": "work", "en": "Let's keep in touch.", "zh": "我們保持聯絡。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000289", "type": "work", "category": "work", "en": "I need more time.", "zh": "我需要更多時間。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000290", "type": "work", "category": "work", "en": "That makes sense.", "zh": "這說得通。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000291", "type": "work", "category": "work", "en": "I see what you mean.", "zh": "我懂你的意思。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000292", "type": "work", "category": "work", "en": "Let's move forward.", "zh": "我們繼續前進吧。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000293", "type": "work", "category": "work", "en": "I'll take care of it.", "zh": "我會處理好的。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000294", "type": "work", "category": "work", "en": "Please let me know.", "zh": "請讓我知道。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000295", "type": "work", "category": "work", "en": "I'll double check.", "zh": "我會再確認一次。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000296", "type": "work", "category": "work", "en": "Sorry for the delay.", "zh": "抱歉延誤了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000297", "type": "work", "category": "work", "en": "Thanks for understanding.", "zh": "謝謝你的理解。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000298", "type": "work", "category": "work", "en": "I'm available anytime.", "zh": "我隨時都有空。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000299", "type": "work", "category": "work", "en": "Let's finalize this.", "zh": "我們把這個定案吧。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000300", "type": "work", "category": "work", "en": "I'll keep you posted.", "zh": "我會隨時告訴你進度。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000301", "type": "work", "category": "work", "en": "It's under control.", "zh": "一切都在掌控中。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000302", "type": "work", "category": "work", "en": "Let's discuss it later.", "zh": "我們晚點再討論。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000303", "type": "work", "category": "work", "en": "I have a quick question.", "zh": "我有個小問題。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000304", "type": "work", "category": "work", "en": "Sounds like a plan.", "zh": "聽起來是個好計畫。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000305", "type": "work", "category": "work", "en": "I'll loop you in.", "zh": "我會讓你知道最新狀況。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000306", "type": "work", "category": "work", "en": "Let's start over.", "zh": "我們重新開始吧。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000307", "type": "work", "category": "work", "en": "Good work today.", "zh": "今天辛苦了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000308", "type": "work", "category": "work", "en": "Let's wrap it up.", "zh": "我們來結束吧。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000309", "type": "work", "category": "work", "en": "I'm heading out now.", "zh": "我現在要出門了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000310", "type": "work", "category": "work", "en": "Almost there.", "zh": "快到了／快完成了。", "pron": "", "exEn": "", "exZh": "", "diff": "medium"},
{"id": "eng_000311", "type": "sos", "category": "sos", "en": "I don't understand.", "zh": "我不明白。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000312", "type": "sos", "category": "sos", "en": "Please speak slowly.", "zh": "請說慢一點。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000313", "type": "sos", "category": "sos", "en": "Please say it again.", "zh": "請再說一次。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000314", "type": "sos", "category": "sos", "en": "Can you help me?", "zh": "你可以幫我嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000315", "type": "sos", "category": "sos", "en": "What does this mean?", "zh": "這是什麼意思？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000316", "type": "sos", "category": "sos", "en": "How do I say this in English?", "zh": "這個用英文怎麼說？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000317", "type": "sos", "category": "sos", "en": "Can you write it down?", "zh": "你可以寫下來嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000318", "type": "sos", "category": "sos", "en": "I don't speak English well.", "zh": "我英文說得不太好。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000319", "type": "sos", "category": "sos", "en": "Please wait a moment.", "zh": "請稍等一下。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000320", "type": "sos", "category": "sos", "en": "I need help.", "zh": "我需要幫忙。", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000321", "type": "sos", "category": "sos", "en": "Where is the restroom?", "zh": "洗手間在哪裡？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000322", "type": "sos", "category": "sos", "en": "Where can I get a taxi?", "zh": "哪裡可以叫到計程車？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000323", "type": "sos", "category": "sos", "en": "How much is it?", "zh": "這多少錢？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000324", "type": "sos", "category": "sos", "en": "Can you show me?", "zh": "你可以指給我看嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000325", "type": "sos", "category": "sos", "en": "Is this okay?", "zh": "這樣可以嗎？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"},
{"id": "eng_000326", "type": "sos", "category": "sos", "en": "What should I do?", "zh": "我該怎麼做？", "pron": "", "exEn": "", "exZh": "", "diff": "easy"}

/* ============================ TaskManager ============================ */
const TaskManager = {
  nowISO(){ return new Date().toISOString(); },
  pad(n){ return n<10?'0'+n:''+n; },
  fmtDT(iso){
    const d = new Date(iso);
    return this.pad(d.getMonth()+1)+'/'+this.pad(d.getDate())+' '+this.pad(d.getHours())+':'+this.pad(d.getMinutes());
  },
  fmtTime(iso){
    const d = new Date(iso);
    return this.pad(d.getHours())+':'+this.pad(d.getMinutes());
  },
  isSameDay(iso, ref){
    const d = new Date(iso); const r = ref || new Date();
    return d.getFullYear()===r.getFullYear() && d.getMonth()===r.getMonth() && d.getDate()===r.getDate();
  },
  isToday(iso){ return this.isSameDay(iso, new Date()); },
  todayStamp(){
    const t = new Date();
    return t.getFullYear()+'/'+this.pad(t.getMonth()+1)+'/'+this.pad(t.getDate());
  },
  todayDateStr(){
    const t = new Date();
    return t.getFullYear()+'-'+this.pad(t.getMonth()+1)+'-'+this.pad(t.getDate());
  },

  computeDueAt(deadlineType, opt){
    opt = opt || {};
    if(deadlineType==='none' || !deadlineType) return null;
    if(deadlineType==='custom'){
      if(opt.customDT) return new Date(opt.customDT).toISOString();
      return null;
    }
    const base = new Date();
    if(deadlineType==='tomorrow') base.setDate(base.getDate()+1);
    if(deadlineType==='week') base.setDate(base.getDate()+7);
    let hh=18, mm=0;
    if(opt.time){
      const parts = opt.time.split(':');
      if(parts.length===2){ hh=Number(parts[0]); mm=Number(parts[1]); }
    }
    base.setHours(hh, mm, 0, 0);
    return base.toISOString();
  },
  dueLabel(t){
    if(!t.dueAt) return '未設定期限';
    const d = new Date(t.dueAt);
    const now = new Date();
    let prefix;
    if(this.isSameDay(t.dueAt, now)) prefix = '今天';
    else {
      const tmr = new Date(now); tmr.setDate(tmr.getDate()+1);
      if(this.isSameDay(t.dueAt, tmr)) prefix = '明天';
      else prefix = (d.getMonth()+1)+'/'+d.getDate();
    }
    return prefix + ' ' + this.pad(d.getHours())+':'+this.pad(d.getMinutes());
  },
  isOverdue(t){
    if(t.status==='done' || !t.dueAt) return false;
    return new Date(t.dueAt).getTime() < Date.now();
  },
  overdueLabel(t){
    const diffMs = Date.now() - new Date(t.dueAt).getTime();
    const mins = Math.floor(diffMs/60000);
    if(mins < 60) return `⚠️ 已逾期 ${mins} 分鐘`;
    const hrs = Math.floor(mins/60);
    const remMin = mins % 60;
    if(hrs < 24) return `⚠️ 已逾期 ${hrs} 小時${remMin>0? remMin+'分':''}`;
    const days = Math.floor(hrs/24);
    return `⚠️ 已逾期 ${days} 天`;
  },
  remainingLabel(t){
    if(!t.dueAt || t.status==='done') return '';
    if(this.isOverdue(t)) return this.overdueLabel(t);
    const diffMs = new Date(t.dueAt).getTime() - Date.now();
    const mins = Math.floor(diffMs/60000);
    if(mins < 60) return `⏱ 還有 ${mins} 分鐘`;
    const hrs = Math.floor(mins/60);
    const remMin = mins % 60;
    if(hrs < 24) return `⏱ 還有 ${hrs} 小時${remMin>0? remMin+'分':''}`;
    const days = Math.floor(hrs/24);
    return `⏱ 還有 ${days} 天`;
  },

  timerRunning(t){
    if(!t.workSessions || !t.workSessions.length) return false;
    return t.workSessions[t.workSessions.length-1].end === null;
  },
  elapsedSeconds(t, onlyToday){
    if(!t.workSessions) return 0;
    let total = 0;
    const now = Date.now();
    t.workSessions.forEach(s=>{
      const start = new Date(s.start).getTime();
      const end = s.end ? new Date(s.end).getTime() : now;
      if(onlyToday && !this.isToday(s.start)) return;
      total += Math.max(0, end - start);
    });
    return Math.floor(total/1000);
  },
  fmtElapsed(sec){
    if(sec < 60) return '不到 1 分鐘';
    const mins = Math.floor(sec/60);
    if(mins < 60) return `${mins} 分鐘`;
    const hrs = Math.floor(mins/60);
    const remMin = mins % 60;
    return `${hrs} 小時${remMin>0? remMin+'分':''}`;
  },

  addHistory(t, desc){
    t.history.push({ time:this.nowISO(), desc });
  },

  createTask(fields){
    const t = {
      id: Store.uid(),
      content: fields.content.trim(),
      source: fields.source || 'boss',
      priority: fields.priority || 'normal',
      deadlineType: fields.deadlineType || 'none',
      dueAt: this.computeDueAt(fields.deadlineType, fields),
      note: (fields.note||'').trim(),
      status: 'notstarted',
      progress: 0,
      createdAt: this.nowISO(),
      completedAt: null,
      isAdhoc: !!fields.isAdhoc,
      important: !!fields.important,
      urgent: !!fields.urgent,
      workSessions: [],
      waitingFor: '',
      followUpType: 'none',
      followUpAt: null,
      history: [],
      reports: []
    };
    this.addHistory(t, '新增任務');
    Store.data.tasks.unshift(t);
    Store.save();
    return t;
  },
  getTask(id){ return Store.data.tasks.find(t=>t.id===id); },

  setStatus(id, status){
    const t = this.getTask(id); if(!t || t.status===status) return;
    t.status = status;
    if(status==='done'){
      t.progress = 100;
      t.completedAt = this.nowISO();
      if(this.timerRunning(t)) t.workSessions[t.workSessions.length-1].end = this.nowISO();
      this.addHistory(t, '標記完成');
    } else {
      t.completedAt = null;
      this.addHistory(t, `狀態改為「${STATUS_META[status].label}」`);
    }
    Store.save();
  },
  setPriority(id, p){
    const t = this.getTask(id); if(!t || t.priority===p) return;
    t.priority = p;
    this.addHistory(t, `優先程度改為「${PRIORITY_LABEL[p]}」`);
    Store.save();
  },
  setImportant(id, val){
    const t = this.getTask(id); if(!t) return;
    val = !!val;
    if(t.important===val) return;
    t.important = val;
    this.addHistory(t, `艾森豪威爾：重要程度改為「${val?'重要':'不重要'}」`);
    Store.save();
  },
  setUrgent(id, val){
    const t = this.getTask(id); if(!t) return;
    val = !!val;
    if(t.urgent===val) return;
    t.urgent = val;
    this.addHistory(t, `艾森豪威爾：緊急程度改為「${val?'緊急':'不緊急'}」`);
    Store.save();
  },
  eisenhowerQuadrant(t){
    const imp = !!t.important, urg = !!t.urgent;
    if(imp && urg) return 'A';
    if(imp && !urg) return 'B';
    if(!imp && urg) return 'C';
    return 'D';
  },
  setDeadline(id, deadlineType, opt){
    const t = this.getTask(id); if(!t) return;
    const before = this.dueLabel(t);
    t.deadlineType = deadlineType;
    t.dueAt = this.computeDueAt(deadlineType, opt||{});
    const wasOverdue = before.indexOf('未設定')===-1;
    this.addHistory(t, `期限由「${before}」改為「${this.dueLabel(t)}」`);
    Store.save();
  },
  setWaiting(id, waitingFor, followUpType){
    const t = this.getTask(id); if(!t) return;
    t.waitingFor = waitingFor;
    t.followUpType = followUpType;
    const base = new Date();
    if(followUpType==='today') t.followUpAt = this.todayDateStr();
    else if(followUpType==='tomorrow'){ base.setDate(base.getDate()+1); t.followUpAt = base.getFullYear()+'-'+this.pad(base.getMonth()+1)+'-'+this.pad(base.getDate()); }
    else if(followUpType==='week'){ base.setDate(base.getDate()+7); t.followUpAt = base.getFullYear()+'-'+this.pad(base.getMonth()+1)+'-'+this.pad(base.getDate()); }
    else t.followUpAt = null;
    this.addHistory(t, `等待事項更新：${waitingFor||'（未填寫）'}`);
    Store.save();
  },
  needsFollowUp(t){
    if(t.status!=='waiting' || !t.followUpAt) return false;
    return t.followUpAt <= this.todayDateStr();
  },
  startWork(id){
    const t = this.getTask(id); if(!t) return;
    if(this.timerRunning(t)) return;
    t.workSessions.push({ start:this.nowISO(), end:null });
    if(t.status!=='inprogress'){ t.status='inprogress'; }
    this.addHistory(t, t.workSessions.length>1 ? '再開始處理' : '開始處理');
    Store.save();
  },
  pauseWork(id){
    const t = this.getTask(id); if(!t) return;
    if(!this.timerRunning(t)) return;
    t.workSessions[t.workSessions.length-1].end = this.nowISO();
    this.addHistory(t, '暫停');
    Store.save();
  },
  completeWork(id){
    this.setStatus(id, 'done');
  },

  getBucket(t){
    if(t.status==='done') return 'done';
    if(t.status==='waiting') return 'yellow';
    if(!t.dueAt) return 'white';
    const dueToday = this.isSameDay(t.dueAt, new Date()) || this.isOverdue(t);
    if(dueToday && t.priority==='urgent') return 'red';
    if(dueToday) return 'orange';
    return 'green';
  },
  sortScore(t){
    let score = 0;
    if(this.isOverdue(t)) score -= 1000;
    if(t.dueAt && this.isSameDay(t.dueAt, new Date())) score -= 200;
    if(t.priority==='urgent') score -= 50;
    else if(t.priority==='low') score += 50;
    if(t.status==='waiting') score += 300;
    if(t.dueAt) score += new Date(t.dueAt).getTime()/1e13; // fine tiebreak
    return score;
  },
  openTasks(){ return Store.data.tasks.filter(t=>t.status!=='done'); },
  sortedOpenTasks(){
    return this.openTasks().slice().sort((a,b)=>this.sortScore(a)-this.sortScore(b));
  },
  nextUpList(){ return this.sortedOpenTasks().slice(0,3); },
  bucketize(){
    const buckets = {}; BUCKET_ORDER.forEach(b=>buckets[b]=[]);
    const done = [];
    this.sortedOpenTasks().forEach(t=>{
      const b = this.getBucket(t);
      if(b==='done') done.push(t); else buckets[b].push(t);
    });
    Store.data.tasks.filter(t=>t.status==='done').sort((a,b)=>new Date(b.completedAt||b.createdAt)-new Date(a.completedAt||a.createdAt)).forEach(t=>done.push(t));
    return { buckets, done };
  },
  homeCounts(){
    return {
      urgent: Store.data.tasks.filter(t=>t.priority==='urgent' && t.status!=='done').length,
      today: Store.data.tasks.filter(t=>t.dueAt && this.isSameDay(t.dueAt,new Date()) && t.status!=='done').length,
      waiting: Store.data.tasks.filter(t=>t.status==='waiting').length,
      done: Store.data.tasks.filter(t=>t.status==='done' && this.isToday(t.completedAt||t.createdAt)).length,
      adhoc: Store.data.tasks.filter(t=>t.isAdhoc && this.isToday(t.createdAt)).length
    };
  },
  oneLiner(){
    const open = this.openTasks();
    const c = this.homeCounts();
    if(Store.data.tasks.length===0) return '今天暫時沒有待辦，可以喘口氣。';
    if(open.length===0) return '今天的事情都處理完了。收工。';
    if(open.length>=6) return `今天事情比較多（${open.length} 件），先不要一次看全部，一件一件來。`;
    if(c.urgent>0) return `今天有 ${open.length} 件事情，先處理最急的 ${Math.min(c.urgent,open.length)} 件。`;
    return `今天還有 ${open.length} 件事情，按順序一件一件處理就好。`;
  },
  completedTodayList(){
    return Store.data.tasks.filter(t=>t.status==='done' && this.isToday(t.completedAt||t.createdAt))
      .sort((a,b)=>new Date(b.completedAt||0)-new Date(a.completedAt||0));
  },
  deadlineChangesToday(){
    let n = 0;
    Store.data.tasks.forEach(t=>t.history.forEach(h=>{
      if(h.desc.indexOf('期限')===0 && this.isToday(h.time)) n++;
    }));
    return n;
  },
  elapsedTotalTodaySeconds(){
    let total = 0;
    Store.data.tasks.forEach(t=>{ total += this.elapsedSeconds(t, true); });
    return total;
  },
  filterTasks(list, filterKey, searchText){
    let out = list;
    if(filterKey==='today') out = out.filter(t=>t.dueAt && this.isSameDay(t.dueAt,new Date()) && t.status!=='done');
    else if(filterKey==='urgent') out = out.filter(t=>t.priority==='urgent' && t.status!=='done');
    else if(filterKey==='waiting') out = out.filter(t=>t.status==='waiting');
    else if(filterKey==='inprogress') out = out.filter(t=>t.status==='inprogress');
    else if(filterKey==='done') out = out.filter(t=>t.status==='done');
    if(searchText && searchText.trim()){
      const q = searchText.trim().toLowerCase();
      out = out.filter(t=>t.content.toLowerCase().indexOf(q)>=0);
    }
    return out;
  }
};

/* ============================ ReportGenerator ============================ */
const ReportGenerator = {
  core(subject, status, progress, note){
    const s = subject && subject.trim() ? subject.trim() : '此事項';
    const n = note && note.trim() ? note.trim() : '';
    switch(status){
      case 'done': return { s, body:`「${s}」已完成${n? '，'+n:''}` };
      case 'inprogress': return { s, body:`「${s}」處理中，進度約${progress}%${n? '，'+n:''}` };
      case 'waiting': return { s, body:`「${s}」處理中，進度約${progress}%，目前尚待${n||'相關資料／他人回覆'}` };
      case 'problem': return { s, body:`「${s}」進度約${progress}%，目前遇到${n||'一些狀況'}，正設法排除` };
      case 'notstarted': return { s, body:`「${s}」尚未開始處理${n? '，'+n:''}` };
    }
    return { s, body:`「${s}」` };
  },
  generate(subject, status, progress, note){
    const { s, body } = this.core(subject, status, progress, note);
    const tails = {
      done: { standard:'，請您查核。', formal:'，相關內容已處理完畢，以上報告。', verbal:'，跟您說一聲。', short:'。' },
      inprogress: { standard:'，完成後再向您回報。', formal:'，後續將持續辦理，如有進度將適時回報。', verbal:'，我等等再跟您說。', short:'。' },
      waiting: { standard:'，收到後會接續處理，完成後再向您回報。', formal:'，俟收到後將接續辦理，並適時回報。', verbal:'，資料到了我再繼續弄。', short:'。' },
      problem: { standard:'，如需要您協助裁示會再向您報告。', formal:'，如有需要指示之處，將即時請示。', verbal:'，如果需要您幫忙我再跟您說。', short:'。' },
      notstarted: { standard:'，會盡快安排時間處理，完成後向您回報。', formal:'，將儘速安排辦理，完成後回報。', verbal:'，我等等就來處理。', short:'。' }
    };
    const t = tails[status] || tails.inprogress;
    const standard = `報告長官，目前${body}${t.standard}`;
    const formal = `報告長官：茲報告，${body}${t.formal}`;
    const verbal = `長官，${body.replace(/「|」/g,'')}${t.verbal}`;
    const shortText = `「${s}」${status==='done'?'已完成':'進度約'+progress+'%'}${note&&note.trim()? '，'+note.trim():''}${t.short}`;
    return { standard, short:shortText, formal, verbal };
  },
  allUrgentText(letters){
    const n = letters.length;
    const cnLabel = ['一','兩','三','四','五','六'][n-1] || (n+'');
    const joined = letters.join('、');
    return `報告長官，目前手邊有 ${joined} ${n===1?'一項任務':cnLabel+'項任務'}，為確保今日能完成，請示優先處理順序。`;
  },
  followUpText(waitingFor){
    const w = waitingFor && waitingFor.trim() ? waitingFor.trim() : '相關事項';
    return `您好，想確認一下先前詢問的${w}目前是否方便提供，收到後我會接續處理，謝謝。`;
  }
};

const StressModule = {
  moods: MOODS,
  stages: RELAX_STAGES,
  stageText(elapsed){
    for(const st of this.stages){ if(elapsed < st.until) return st.text; }
    return this.stages[this.stages.length-1].text;
  },
  logStart(mood){

    Store.save();
  },
  logComplete(){
    const log = Store.data.stressLog;
    if(log.length) log[log.length-1].completed = true;
    Store.save();
  },
  logInterrupt(){
    Store.data.interruptions.push(TaskManager.nowISO());
    Store.save();
  },
  interruptionsToday(){
    return Store.data.interruptions.filter(iso=>TaskManager.isToday(iso)).length;
  },
  interruptionCountsByDay(days){
    // 回傳最近 N 天（含今天）每天被打斷的次數，由舊到新排序
    const out = [];
    const today = new Date(); today.setHours(0,0,0,0);
    for(let i=days-1;i>=0;i--){
      const d = new Date(today);
      d.setDate(d.getDate()-i);
      const dateStr = d.getFullYear()+'-'+TaskManager.pad(d.getMonth()+1)+'-'+TaskManager.pad(d.getDate());
      const count = Store.data.interruptions.filter(iso=>{
        const t = new Date(iso);
        return t.getFullYear()===d.getFullYear() && t.getMonth()===d.getMonth() && t.getDate()===d.getDate();
      }).length;
      const weekLabels = ['日','一','二','三','四','五','六'];
      out.push({ dateStr, count, dayNum:d.getDate(), weekLabel:weekLabels[d.getDay()], isToday:i===0 });
    }
    return out;
  },
  interruptionSummary(days){
    const data = this.interruptionCountsByDay(days);
    const total = data.reduce((s,d)=>s+d.count,0);
    const max = Math.max(1, ...data.map(d=>d.count));
    const avg = (total/days);
    // 找出打斷次數最高的那一天
    let peak = data[0];
    data.forEach(d=>{ if(d.count>peak.count) peak = d; });
    return { data, total, max, avg, peak };
  }
};

/* ============================ CalendarManager ============================ */
const CalendarManager = {
  pad(n){ return n<10?'0'+n:''+n; },
  dateStr(y,m,d){ return y+'-'+this.pad(m)+'-'+this.pad(d); },
  todayStr(){ const t=new Date(); return this.dateStr(t.getFullYear(), t.getMonth()+1, t.getDate()); },
  daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr+'T00:00:00');
    return Math.round((target - today)/86400000);
  },
  // 國定/軍中節日：換算成「今年」或「明年」最近一次發生的日期
  nextOccurrence(month, day){
    const now = new Date();
    let y = now.getFullYear();
    let d = new Date(y, month-1, day);
    d.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    if(d < today) d = new Date(y+1, month-1, day);
    return this.dateStr(d.getFullYear(), d.getMonth()+1, d.getDate());
  },
  nationalEventsUpcoming(){
    return NATIONAL_EVENTS.map(e=>{
      const dateStr = this.nextOccurrence(e.month, e.day);
      return { id:'nat:'+e.key, title:e.title, note:e.note, date:dateStr, daysUntil:this.daysUntil(dateStr), type:'national' };
    });
  },
  customEventsUpcoming(){
    const list = [];
    (Store.data.customEvents||[]).forEach(ev=>{
      let dateStr = ev.date;
      if(ev.recurring==='yearly'){
        const parts = ev.date.split('-');
        dateStr = this.nextOccurrence(Number(parts[1]), Number(parts[2]));
      } else {
        // 一次性事件，若已過去就不再顯示在「即將到來」清單
        if(this.daysUntil(ev.date) < 0) return;
      }
      list.push({ id:ev.id, title:ev.title, note:ev.note||'', date:dateStr, daysUntil:this.daysUntil(dateStr), type:'custom', recurring:ev.recurring });
    });
    return list;
  },
  allUpcoming(limit){
    const combined = this.nationalEventsUpcoming().concat(this.customEventsUpcoming());
    combined.sort((a,b)=>a.daysUntil-b.daysUntil);
    return limit ? combined.slice(0,limit) : combined;
  },
  eventsOnDate(dateStr){
    const nat = NATIONAL_EVENTS.filter(e=>{
      const now = new Date(dateStr+'T00:00:00');
      return (now.getMonth()+1)===e.month && now.getDate()===e.day;
    }).map(e=>({ id:'nat:'+e.key, title:e.title, note:e.note, type:'national' }));
    const custom = (Store.data.customEvents||[]).filter(ev=>{
      if(ev.recurring==='yearly'){
        const evParts = ev.date.split('-');
        const dParts = dateStr.split('-');
        return evParts[1]===dParts[1] && evParts[2]===dParts[2];
      }
      return ev.date===dateStr;
    }).map(ev=>({ id:ev.id, title:ev.title, note:ev.note||'', type:'custom', recurring:ev.recurring }));
    const tasks = Store.data.tasks.filter(t=>t.dueAt && t.dueAt.slice(0,10)===dateStr);
    return { nat, custom, tasks };
  },
  monthGrid(year, month){
    // month: 1-12。回傳 42 格（6 週）的日期字串陣列，含上下月補齊的日期
    const first = new Date(year, month-1, 1);
    const firstWeekday = first.getDay(); // 0=Sun
    const cells = [];
    const start = new Date(year, month-1, 1 - firstWeekday);
    for(let i=0;i<42;i++){
      const d = new Date(start);
      d.setDate(start.getDate()+i);
      cells.push({ dateStr:this.dateStr(d.getFullYear(), d.getMonth()+1, d.getDate()), inMonth: d.getMonth()===month-1, dayNum: d.getDate() });
    }
    return cells;
  },
  addCustomEvent(fields){
    const ev = {
      id: 'E' + Store.uid(),
      title: fields.title.trim(),
      date: fields.date,
      note: (fields.note||'').trim(),
      recurring: fields.recurring || 'once'
    };
    Store.data.customEvents.push(ev);
    Store.save();
    return ev;
  },
  updateCustomEvent(id, fields){
    const ev = Store.data.customEvents.find(e=>e.id===id);
    if(!ev) return;
    if(fields.title!==undefined) ev.title = fields.title.trim();
    if(fields.date!==undefined) ev.date = fields.date;
    if(fields.note!==undefined) ev.note = fields.note.trim();
    if(fields.recurring!==undefined) ev.recurring = fields.recurring;
    Store.save();
  },
  deleteCustomEvent(id){
    Store.data.customEvents = Store.data.customEvents.filter(e=>e.id!==id);
    Store.save();
  }
};

// 通用的簡易 CRUD 建立器：給一個 Store.data 底下的陣列 key，回傳 add/update/delete/get/list
function makeSimpleManager(storeKey){
  return {
    add(fields){
      const entry = Object.assign({}, fields, {
        id: 'R' + Store.uid(),
        date: fields.date || TaskManager.todayDateStr(),
        createdAt: TaskManager.nowISO(),
        updatedAt: TaskManager.nowISO()
      });
      Store.data[storeKey].push(entry);
      Store.save();
      return entry;
    },
    update(id, fields){
      const e = Store.data[storeKey].find(x=>x.id===id);
      if(!e) return;
      Object.assign(e, fields, { updatedAt:TaskManager.nowISO() });
      Store.save();
    },
    delete(id){
      Store.data[storeKey] = Store.data[storeKey].filter(x=>x.id!==id);
      Store.save();
    },
    get(id){ return Store.data[storeKey].find(x=>x.id===id); },
    list(){
      return Store.data[storeKey].slice().sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
    },
    inRange(rangeKey){
      // rangeKey: 'today' | 'week' | 'month' | 'all'
      const all = this.list();
      if(rangeKey==='all') return all;
      const today = new Date(); today.setHours(0,0,0,0);
      return all.filter(e=>{
        const d = new Date(e.date+'T00:00:00');
        if(rangeKey==='today') return e.date===TaskManager.todayDateStr();
        if(rangeKey==='week'){ const diff=(today-d)/86400000; return diff>=0 && diff<7; }
        if(rangeKey==='month'){ return d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth(); }
        return true;
      });
    }
  };
}

    return this.list().filter(x=>{
      const d = new Date(x.date+'T00:00:00');
      const diff = (today-d)/86400000;
      return diff>=0 && diff<days;
    });
  },
  durationMinutes(bucket){
    const map = { '<5':2.5, '5-15':10, '15-30':22.5, '30-60':45, '>60':75 };
    return map[bucket] !== undefined ? map[bucket] : null;
  },
  stats(days){
    const list = this.inRange(days);
    if(list.length===0) return { count:0 };
    const reasonCounts = {};
    let durSum = 0, durN = 0;
    let backCount = 0, backAnswered = 0;
    list.forEach(x=>{
      if(x.reason){ reasonCounts[x.reason] = (reasonCounts[x.reason]||0)+1; }
      const m = this.durationMinutes(x.duration);
      if(m!==null){ durSum += m; durN++; }
      if(x.cameBack==='yes' || x.cameBack==='no'){ backAnswered++; if(x.cameBack==='yes') backCount++; }
    });
    let topReason = null, topN = 0;
    Object.keys(reasonCounts).forEach(r=>{ if(reasonCounts[r]>topN){ topN=reasonCounts[r]; topReason=r; } });
    return {
      count: list.length,
      topReason,
      avgDuration: durN>0 ? Math.round(durSum/durN) : null,
      returnRate: backAnswered>0 ? Math.round(backCount/backAnswered*100) : null
    };
  }
});

    const p = this.getProfile();
    if(!p.enlistmentDate) return 0;
    const enlist = new Date(p.enlistmentDate);
    if(isNaN(enlist.getTime())) return 0;
    const now = new Date();
    const diffMs = now - enlist;
    if(diffMs < 0) return 0;
    const years = diffMs / (1000 * 60 * 60 * 24 * 365.25);
    return Math.max(0, parseFloat(years.toFixed(1)));
  },
  calcCountdown(targetDateStr){
    if(!targetDateStr) return null;
    const target = new Date(targetDateStr);
    if(isNaN(target.getTime())) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    target.setHours(0, 0, 0, 0);
    const diffMs = target - today;
    const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
    if(diffDays <= 0){
      return { passed: true, days: 0, years: 0, months: 0 };
    }
    const years = Math.floor(diffDays / 365);
    const remainingDaysAfterYears = diffDays % 365;
    const months = Math.floor(remainingDaysAfterYears / 30);
    return { passed: false, days: diffDays, years, months };
  },

    return this.calcCountdown(this.getProfile().dischargeDate);
