const TrendManager = {
  getRangeDays(){
    return (Store.data && Store.data.trendSettings && Store.data.trendSettings.range) || 7;
  },
  setRangeDays(range){
    if(!Store.data.trendSettings) Store.data.trendSettings = { range: 7 };
    Store.data.trendSettings.range = range;
    Store.save();
  },
  getMetrics(range){
    if(!range) range = this.getRangeDays();
    const today = new Date();
    today.setHours(23, 59, 59, 999);

    let daysLimit = 99999;
    if(range !== 'all'){
      daysLimit = parseInt(range) || 7;
    }

    const cutoff = new Date(today);
    if(daysLimit !== 99999){
      cutoff.setDate(cutoff.getDate() - daysLimit);
      cutoff.setHours(0, 0, 0, 0);
    } else {
      cutoff.setTime(0);
    }

    const prevCutoff = new Date(cutoff);
    if(daysLimit !== 99999){
      prevCutoff.setDate(prevCutoff.getDate() - daysLimit);
    }

    const isCurrent = (isoStr) => {
      if(!isoStr) return false;
      const d = new Date(isoStr);
      return d >= cutoff && d <= today;
    };
    const isPrev = (isoStr) => {
      if(!isoStr || daysLimit === 99999) return false;
      const d = new Date(isoStr);
      return d >= prevCutoff && d < cutoff;
    };

    const hl = (Store.data && Store.data.healthLogs) ? Store.data.healthLogs : {};
    const filterLogs = (logs, currentOnly) => {
      if(!Array.isArray(logs)) return [];
      return logs.filter(item => {
        const iso = item.iso || item.createdAt || item.date;
        return currentOnly ? isCurrent(iso) : isPrev(iso);
      });
    };

    const calcAvg = (logs, key) => {
      if(!logs || logs.length === 0) return null;
      const sum = logs.reduce((acc, curr) => acc + (parseFloat(curr[key] !== undefined ? curr[key] : (curr.value !== undefined ? curr.value : curr.val)) || 0), 0);
      return sum / logs.length;
    };

    const currentMoodLogs = filterLogs(hl.mood, true);
    const prevMoodLogs = filterLogs(hl.mood, false);
    const moodAvg = calcAvg(currentMoodLogs, 'score') || calcAvg(currentMoodLogs, 'val') || calcAvg(currentMoodLogs, 'value');
    const prevMoodAvg = calcAvg(prevMoodLogs, 'score') || calcAvg(prevMoodLogs, 'val') || calcAvg(prevMoodLogs, 'value');

    const currentStressLogs = filterLogs(hl.stress, true);
    const prevStressLogs = filterLogs(hl.stress, false);
    const stressAvg = calcAvg(currentStressLogs, 'score') || calcAvg(currentStressLogs, 'val') || calcAvg(currentStressLogs, 'value');
    const prevStressAvg = calcAvg(prevStressLogs, 'score') || calcAvg(prevStressLogs, 'val') || calcAvg(prevStressLogs, 'value');

    const currentSleepLogs = filterLogs(hl.sleep, true);
    const prevSleepLogs = filterLogs(hl.sleep, false);
    const sleepAvg = calcAvg(currentSleepLogs, 'hours') || calcAvg(currentSleepLogs, 'val') || calcAvg(currentSleepLogs, 'value');
    const prevSleepAvg = calcAvg(prevSleepLogs, 'hours') || calcAvg(prevSleepLogs, 'val') || calcAvg(prevSleepLogs, 'value');

    const currentWaterLogs = filterLogs(hl.water, true);
    const waterAvg = calcAvg(currentWaterLogs, 'amount') || calcAvg(currentWaterLogs, 'val') || calcAvg(currentWaterLogs, 'value');

    const relaxCount = (Store.data.relaxSessions || []).filter(s => isCurrent(s.iso || s.createdAt)).length;
    const mindfulnessCount = (Store.data.mindfulnessSessions || []).filter(s => isCurrent(s.iso || s.createdAt)).length;

    const interruptions = (Store.data.interruptionLogs || Store.data.interruptions || []).filter(i => isCurrent(i.createdAt || i.iso));
    const interruptionCount = interruptions.length;
    const returnedCount = interruptions.filter(i => i.returned === true || i.status === 'returned').length;
    const returnRate = interruptionCount > 0 ? Math.round((returnedCount / interruptionCount) * 100) : null;

    const gratitudeCount = (Store.data.gratitude || []).filter(g => isCurrent(g.date || g.createdAt)).length;
    const selfAwareCount = (Store.data.selfAwareness || []).filter(s => isCurrent(s.date || s.createdAt)).length;
    const emotionCount = (Store.data.emotions || []).filter(e => isCurrent(e.date || e.createdAt)).length;

    const woopCount = (Store.data.woops || []).filter(w => isCurrent(w.date || w.createdAt)).length;
    const swotCount = (Store.data.swotRecords || []).filter(s => isCurrent(s.date || s.createdAt)).length;
    const fiveWOneHCount = (Store.data.fiveWOneHRecords || []).filter(f => isCurrent(f.date || f.createdAt)).length;
    const pdcaCount = (Store.data.pdcaRecords || []).filter(p => isCurrent(p.date || p.createdAt)).length;

    const englishProgress = Store.data.englishProgress || {};
    let englishReviewCount = 0;
    let englishKnownCount = 0;
    Object.keys(englishProgress).forEach(id => {
      const p = englishProgress[id];
      if(p.status === 'known') englishKnownCount++;
      if(p.lastReviewed && isCurrent(p.lastReviewed)) englishReviewCount += (p.reviewCount || 1);
    });
    const englishFavoriteCount = (Store.data.englishFavorites || []).length;

    const getTrendSymbol = (curr, prev, higherIsBetter = true) => {
      if(curr === null || prev === null || curr === undefined || prev === undefined) return { symbol: '→', text: '大致穩定' };
      const diff = curr - prev;
      if(Math.abs(diff) < 0.1) return { symbol: '→', text: '大致穩定' };
      if(diff > 0){
        return higherIsBetter ? { symbol: '↗️', text: '比前一週稍微好一些' } : { symbol: '↗️', text: '稍微升高' };
      } else {
        return higherIsBetter ? { symbol: '↘️', text: '最近稍微下降' } : { symbol: '↘️', text: '稍微降低' };
      }
    };

    const hasData = (currentMoodLogs.length > 0 || currentStressLogs.length > 0 || currentSleepLogs.length > 0 || currentWaterLogs.length > 0 || relaxCount > 0 || mindfulnessCount > 0 || interruptionCount > 0 || gratitudeCount > 0 || selfAwareCount > 0 || emotionCount > 0 || woopCount > 0 || swotCount > 0 || fiveWOneHCount > 0 || pdcaCount > 0 || englishReviewCount > 0);

    return {
      range,
      daysLimit,
      hasData,
      mood: { avg: moodAvg, trend: getTrendSymbol(moodAvg, prevMoodAvg, true) },
      stress: { avg: stressAvg, trend: getTrendSymbol(stressAvg, prevStressAvg, false) },
      sleep: { avg: sleepAvg, trend: getTrendSymbol(sleepAvg, prevSleepAvg, true) },
      water: { avg: waterAvg, goal: (Store.data.settings && Store.data.settings.waterGoal) || 2000 },
      relaxCount,
      mindfulnessCount,
      interruptionCount,
      returnRate,
      gratitudeCount,
      selfAwareCount,
      emotionCount,
      woopCount,
      swotCount,
      fiveWOneHCount,
      pdcaCount,
      englishReviewCount,
      englishKnownCount,
      englishFavoriteCount
    };
  },
  getGentleReminders(m){
    const hints = [];
    if(!m.hasData){
      return ['🌱 還沒有足夠資料，先記錄幾天，我會慢慢幫你看見自己的變化。'];
    }
    if(m.sleep.avg !== null && m.sleep.avg < 7){
      hints.push('🌱 最近睡眠稍微少了一點，也許可以今晚早一點休息。');
    }
    if(m.stress.avg !== null && m.stress.avg > 3.5){
      hints.push('🌿 最近壓力比較高，可以試試 1 分鐘呼吸練習。');
    }
    if(m.water.avg !== null && m.water.avg < m.water.goal){
      hints.push('💧 距離每日喝水目標還有一點點差距，隨手補充一杯水吧。');
    }
    if(m.relaxCount > 0 || m.mindfulnessCount > 0 || m.gratitudeCount > 0){
      hints.push('✨ 這週你有持續照顧自己，做得很好。');
    }
    if(hints.length === 0){
      hints.push('🌿 保持自己的步調，隨時給自己一些關懷與讚許。');
    }
    return hints;
  }
};

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 1700);
}
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast('✓ 已複製，可以直接貼上。');
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('✓ 已複製，可以直接貼上。');
    }catch(e2){ toast('複製失敗，請手動選取文字'); }
  }
}

/* 簡易折線圖：series = [{label, value|null}, ...]，回傳 SVG 字串 */
function buildLineChartSVG(series, color, unit){
  const W = 320, H = 130, padL = 8, padR = 8, padT = 14, padB = 20;
  const points = series.filter(s=>s.value!==null && s.value!==undefined);
  if(points.length===0){
    return `<div class="chart-empty">這段期間還沒有紀錄</div>`;
  }
  const values = points.map(p=>p.value);
  let min = Math.min(...values), max = Math.max(...values);
  if(min===max){ min -= 1; max += 1; }
  const range = max - min;
  const n = series.length;
  const stepX = (W - padL - padR) / Math.max(1, n-1);
  const xy = series.map((s,i)=>{
    const x = padL + i*stepX;
    if(s.value===null || s.value===undefined) return null;
    const y = padT + (H - padT - padB) * (1 - (s.value - min)/range);
    return { x, y, v:s.value };
  });
  let path = '';
  let started = false;
  xy.forEach(p=>{
    if(!p){ started=false; return; }
    path += (started ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' ';
    started = true;
  });
  const dots = xy.map(p=>p ? `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}"/>` : '').join('');
  const labelEvery = n>14 ? Math.ceil(n/7) : (n>7?2:1);
  const labels = series.map((s,i)=>{
    if(i%labelEvery!==0 && i!==n-1) return '';
    const x = padL + i*stepX;
    return `<text x="${x.toFixed(1)}" y="${H-4}" font-size="9" fill="#8B8C7F" text-anchor="middle">${s.label}</text>`;
  }).join('');
  const last = xy.filter(p=>p).slice(-1)[0];
  const lastLabel = last ? `<text x="${last.x.toFixed(1)}" y="${(last.y-8).toFixed(1)}" font-size="10" font-weight="700" fill="${color}" text-anchor="middle">${last.v.toFixed(last.v%1===0?0:1)}${unit||''}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px;">
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${lastLabel}
    ${labels}
  </svg>`;
}

  let html = `

UI.renderTaskListArea = function(buckets, done){
  if(!buckets || !done){ const r = TaskManager.bucketize(); buckets=r.buckets; done=r.done; }
  if(Store.data.tasks.length===0){
    return `<div class="empty"><span class="e">🌿</span>目前沒有任務。<br>點下方「＋新增」，把交辦的事情記下來。</div>`;
  }
  if(uiTasks.filter!=='all' || uiTasks.search.trim()){
    const flat = uiTasks.filter==='done' ? Store.data.tasks.filter(t=>t.status==='done') : TaskManager.filterTasks(uiTasks.filter==='today'||uiTasks.filter==='urgent'||uiTasks.filter==='waiting'||uiTasks.filter==='inprogress' ? TaskManager.openTasks() : Store.data.tasks, uiTasks.filter, uiTasks.search);
    const filtered = TaskManager.filterTasks(flat, 'all', uiTasks.search);
    if(filtered.length===0) return `<div class="empty"><span class="e">🔎</span>沒有符合的任務。</div>`;
    return `<div class="tasklist">${filtered.map(t=>UI.taskCard(t, TaskManager.getBucket(t))).join('')}</div>`;
  }
  let html = '';
  BUCKET_ORDER.forEach(b=>{
    if(buckets[b].length===0) return;
    html += `<div class="bucket-head">${BUCKET_META[b].emoji} ${BUCKET_META[b].label} <span class="bucket-count">（${buckets[b].length}）</span></div>`;
    html += `<div class="tasklist">` + buckets[b].map(t=>UI.taskCard(t,b)).join('') + `</div>`;
  });
  if(done.length){
    html += `<div class="bucket-head">✅ 已完成 <span class="bucket-count">（${done.length}）</span></div>`;
    html += `<div class="tasklist">` + done.map(t=>UI.taskCard(t,'done')).join('') + `</div>`;
  }
  return html;
};
UI.refreshTaskList = function(){
  const el = document.getElementById('taskListArea');
  if(el) el.innerHTML = UI.renderTaskListArea();
};

      const s = gratitudeSummary(g);
      const tagsStr = (g.tags||[]).join(' ');
      return (s.text+tagsStr).toLowerCase().indexOf(q)>=0;
    });
  }

function speakEnglish(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const clean = text.replace(/^A: |^B: /gm,'').split('\n')[0];
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-US';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){ /* 瀏覽器不支援語音時安靜跳過 */ }
}

/* ============================ breathing timer DOM ============================ */
function updateBreatheDOM(){
  const circle = document.getElementById('breatheCircle');
  if(!circle) return;
  const phaseEl = document.getElementById('breathePhase');
  const countEl = document.getElementById('breatheCount');
  const stageEl = document.getElementById('relaxStage');
  const cyclePos = relax.elapsed % 10;
  const inhale = cyclePos < 4;
  circle.classList.toggle('exhale', !inhale);
  phaseEl.textContent = inhale ? '吸氣　4 秒' : '吐氣　6 秒';
  countEl.textContent = 60 - relax.elapsed;
  if(stageEl) stageEl.textContent = StressModule.stageText(relax.elapsed);
}
function startRelax(moodKey){
  relax = { mood: moodKey, elapsed:0, timerId:null };
  StressModule.logStart(moodKey);
  go('relaxTimer');
  relax.timerId = setInterval(relaxTick, 1000);
}
function relaxTick(){
  relax.elapsed += 1;
  if(relax.elapsed >= 60){
    clearInterval(relax.timerId); relax.timerId = null;
    StressModule.logComplete();
    go('relaxDone');
    return;
  }
  updateBreatheDOM();
}
function cancelRelax(){
  if(relax.timerId){ clearInterval(relax.timerId); relax.timerId=null; }
  go('relaxHub');
}

/* ---- V1.8: 放鬆中心計時器 ---- */
function startRelaxCenter(durationKey){
  relaxUI = { duration:durationKey, elapsed:0, timerId:null, feel:null };
  go('relaxCenterTimer');
  relaxUI.timerId = setInterval(relaxCenterTick, 1000);
}
function relaxCenterTick(){
  relaxUI.elapsed += 1;
  const d = BREATH_DURATIONS.find(x=>x.key===relaxUI.duration) || BREATH_DURATIONS[0];
  if(relaxUI.elapsed >= d.seconds){
    clearInterval(relaxUI.timerId); relaxUI.timerId = null;
    go('relaxCenterDone');
    return;
  }
  updateRelaxCenterDOM(d.seconds);
}
function updateRelaxCenterDOM(total){
  const circle = document.getElementById('rcCircle');
  if(!circle) return;
  const phaseEl = document.getElementById('rcPhase');
  const countEl = document.getElementById('rcCount');
  const cyclePos = relaxUI.elapsed % 10;
  const inhale = cyclePos < 4;
  circle.classList.toggle('exhale', !inhale);
  phaseEl.textContent = inhale ? '吸氣　4 秒' : '吐氣　6 秒';
  countEl.textContent = total - relaxUI.elapsed;
}
function cancelRelaxCenter(){
  if(relaxUI.timerId){ clearInterval(relaxUI.timerId); relaxUI.timerId=null; }
  go('relaxHub');
}

function doGenerateReport(){
  const variants = ReportGenerator.generate(formReport.subject, formReport.status, formReport.progress, formReport.note);
  lastReport = variants;
  formReport.tone = 'standard';
  if(formReport.taskId){
    const t = TaskManager.getTask(formReport.taskId);
    if(t){
      t.reports.push({ time:TaskManager.nowISO(), text:variants.standard, status:formReport.status, progress:formReport.progress });
      TaskManager.addHistory(t, `產生回報（${STATUS_META[formReport.status].label}／${formReport.progress}%）`);
      if(formReport.status==='done') TaskManager.setStatus(t.id,'done');
      else { t.status = formReport.status; t.progress = formReport.progress; }
      Store.save();
    }
  }
  render();
}
function handleImportFile(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      Store.importJSON(e.target.result);
      toast('✓ 資料已恢復');
      render();
    }catch(err){
      toast('⚠️ 備份檔格式不正確');
    }
  };
  reader.readAsText(file);
  inputEl.value = '';
}
function exportData(){
  try{
    const blob = new Blob([Store.exportJSON()], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    a.href = url;
    a.download = `nco-assistant-backup-${d.getFullYear()}${TaskManager.pad(d.getMonth()+1)}${TaskManager.pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('✓ 備份完成');
  }catch(e){
    toast('匯出失敗，請稍後再試');
  }
}

/* ============================ EVENT DELEGATION ============================ */
document.addEventListener('click', function(e){
  const overlayClose = e.target.closest('[data-action="close-quickmenu"]');
  if(overlayClose && e.target === overlayClose){ quickMenuOpen=false; overlayClose.remove(); return; }

  const el = e.target.closest('[data-action]');

  const action = el.dataset.action;
  const id = el.dataset.id;
  const value = el.dataset.value;
  const field = el.dataset.field;

  switch(action){
    case 'nav':
      quickMenuOpen = false;
      if(value==='add') formAdd = defaultFormAdd();
      if(value==='adhoc') formAdhoc = { content:'' };
      if(value==='report'){ formReport = defaultFormReport(); lastReport = null; }

      if(value==='cardAddForm'){ formCardAdd = { text:'', category:'today', note:'' }; }
      if(value==='englishAddForm'){ formEnglishAdd = defaultFormEnglishAdd(); }
      if(value==='militaryRetirement'){ formRetirementProfile = defaultFormRetirementProfile(); }
      go(value);
      break;
    case 'set-trend-range':
      TrendManager.setRangeDays(value);
      render();
      break;
    case 'set-retirement-tab':
      retirementUI.tab = value;
      render();
      break;
    case 'set-checklist-cat':
      retirementUI.categoryFilter = value;
      render();
      break;
    case 'open-retirement-edit-modal':
      formRetirementProfile = defaultFormRetirementProfile();
      retirementUI.editProfileModal = true;
      render();
      break;
    case 'close-retirement-edit-modal':
      retirementUI.editProfileModal = false;
      render();
      break;
    case 'save-retirement-profile':
      RetirementManager.updateProfile(formRetirementProfile);
      retirementUI.editProfileModal = false;
      render();
      break;
    case 'clear-retirement-profile':
      if(confirm('確定要清除軍旅及退休資料嗎？')){
        RetirementManager.clearProfile();
        formRetirementProfile = defaultFormRetirementProfile();
        retirementUI.editProfileModal = false;
        render();
      }
      break;
    case 'set-retirement-housing':
      formRetirementProfile.housing = value;
      render();
      break;
    case 'set-retirement-work':
      formRetirementProfile.postWork = value;
      render();
      break;
    case 'toggle-retirement-lifestyle':
      if(!Array.isArray(formRetirementProfile.lifestyle)) formRetirementProfile.lifestyle = [];
      const idx = formRetirementProfile.lifestyle.indexOf(value);
      if(idx >= 0) formRetirementProfile.lifestyle.splice(idx, 1);
      else formRetirementProfile.lifestyle.push(value);
      render();
      break;
    case 'toggle-checklist-status':
      RetirementManager.toggleChecklistStatus(id);
      render();
      break;
    case 'open-checklist-add-modal':
      formChecklistEdit = { id: null, category: retirementUI.categoryFilter !== 'all' ? retirementUI.categoryFilter : 'file', title: '' };
      retirementUI.editChecklistModal = true;
      render();
      break;
    case 'open-checklist-edit-modal':
      const list = RetirementManager.getChecklist();
      const target = list.find(x => x.id === id);
      if(target){
        formChecklistEdit = { id: target.id, category: target.category, title: target.title };
        retirementUI.editChecklistModal = true;
        render();
      }
      break;
    case 'set-checklist-edit-cat':
      formChecklistEdit.category = value;
      render();
      break;
    case 'close-checklist-modal':
      retirementUI.editChecklistModal = false;
      render();
      break;
    case 'save-checklist-item':
      if(!formChecklistEdit.title.trim()){
        alert('請輸入項目名稱');
        break;
      }
      if(formChecklistEdit.id){
        RetirementManager.updateChecklistItem(formChecklistEdit.id, { category: formChecklistEdit.category, title: formChecklistEdit.title.trim() });
      } else {
        RetirementManager.addChecklistItem(formChecklistEdit.category, formChecklistEdit.title.trim());

      retirementUI.editChecklistModal = false;
      render();
      break;
    case 'delete-checklist-item':
      if(confirm('確定要刪除此清單項目嗎？')){
        RetirementManager.deleteChecklistItem(id);
        render();
      }
      break;
    case 'nav-filter':
      uiTasks = { filter:value, search:'' };
      go('tasks');
      break;
    case 'set-filter': uiTasks.filter = value; render(); break;
    case 'open-task': go('taskDetail', {id}); break;
    case 'use-template': {
      const tp = QUICK_TEMPLATES.find(x=>x.key===value);
      if(!tp) break;
      if(tp.gotoAdhoc){ formAdhoc = { content:'' }; go('adhoc'); break; }
      formAdd.content = tp.prefill;
      formAdd.priority = tp.priority;
      formAdd.deadlineType = tp.deadlineType;
      render();
      break;
    }
    case 'save-task': createTaskFromForm(); break;
    case 'save-adhoc': saveAdhoc(); break;
    case 'set-field':
      if(field==='add.source') formAdd.source = value;
      else if(field==='add.deadlineType') formAdd.deadlineType = value;
      else if(field==='add.priority') formAdd.priority = value;
      else if(field==='report.status') formReport.status = value;
      else if(field==='report.progress') formReport.progress = Number(value);
      else if(field==='report.note') formReport.note = (formReport.note===value ? '' : value);
      else if(field==='settings.theme'){ Store.data.settings.theme = value; Store.save(); applyTheme(); }
      else if(field==='settings.englishLevel'){ Store.data.settings.englishLevel = value; Store.save(); }
      else if(field==='event.recurring') formEvent.recurring = value;
      else if(field==='health.quality') formHealth.quality = value;
      else if(field==='health.amount') formHealth.amount = value;
      else if(field==='health.score') formHealth.score = value;
      else if(field==='selfaware.mood') formSelfAware.mood = Number(value);
      else if(field==='selfaware.stress') formSelfAware.stress = Number(value);
      else if(field==='selfaware.energy') formSelfAware.energy = Number(value);
      else if(field==='emotion.emotion') formEmotion.emotion = value;
      else if(field==='emotion.intensity') formEmotion.intensity = Number(value);
      else if(field==='emotion.afterIntensity') formEmotion.afterIntensity = Number(value);
      else if(field==='cardreflect.feeling') formCardReflect.feeling = Number(value);
      else if(field==='interrupt.reason') formInterruption.reason = value;
      else if(field==='interrupt.duration') formInterruption.duration = value;
      else if(field==='interrupt.cameBack') formInterruption.cameBack = value;
      else if(field==='cardadd.category') formCardAdd.category = value;
      else if(field==='engadd.category') formEnglishAdd.category = value;
      render();
      break;
    case 'set-status': TaskManager.setStatus(id, value); render(); break;
    case 'set-priority': TaskManager.setPriority(id, value); render(); break;
    case 'set-deadline':
      if(value==='custom'){ TaskManager.setDeadline(id,'custom',{}); render(); break; }
      TaskManager.setDeadline(id, value, {});
      render();
      break;
    case 'set-followup': {
      const t = TaskManager.getTask(id);
      TaskManager.setWaiting(id, t?t.waitingFor:'', value);
      render();
      break;
    }
    case 'set-waiting-quick': {
      const t = TaskManager.getTask(id);
      TaskManager.setWaiting(id, value, t?t.followUpType:'none');
      render();
      break;
    }
    case 'gen-followup': {
      const t = TaskManager.getTask(id);
      if(t) copyText(ReportGenerator.followUpText(t.waitingFor));
      break;
    }
    case 'start-task': TaskManager.startWork(id); render(); break;
    case 'pause-task': TaskManager.pauseWork(id); render(); break;
    case 'mark-done':
      TaskManager.completeWork(id);
      completeFlash();
      setTimeout(render, 50);
      break;
    case 'quick-report': {
      formReport = defaultFormReport();
      formReport.taskId = id;
      const t = TaskManager.getTask(id);
      formReport.subject = t ? t.content : '';
      lastReport = null;

    case 'set-tone': formReport.tone = value; render(); break;

      const i = formGratitude.tags.indexOf(value);
      if(i>=0) formGratitude.tags.splice(i,1); else formGratitude.tags.push(value);
      render();
      break;
    }
    case 'gratitude-add-tag': {
      const t = gratitudeUI.newTag.trim();
      if(!t){ toast('請輸入標籤名稱'); break; }
      if(!formGratitude.tags.includes(t)) formGratitude.tags.push(t);
      gratitudeUI.newTag = '';
      render();
      break;
    }
    case 'gratitude-intro-ack': {
      Store.data.settings.gratitudeIntroSeen = true;
      Store.save();
      const ov = document.getElementById('gratitudeIntroOverlay');
      if(ov) ov.remove();
      break;
    }
    case 'save-gratitude': {
      if(formGratitude.id) GratitudeManager.update(formGratitude.id, formGratitude);
      else GratitudeManager.add(formGratitude);
      showGentleMessage('gratitude');
      go('gratitude');
      break;
    }

    /* ---- V1.8: 自我覺察 ---- */
    case 'selfaware-range': selfAwareUI.range = value; render(); break;
    case 'selfaware-edit': {
      const s = SelfAwarenessManager.get(id);
      if(s){ formSelfAware = Object.assign(defaultFormSelfAware(), s); go('selfAwareForm'); }
      break;
    }
    case 'selfaware-delete': SelfAwarenessManager.delete(id); toast('🗑️ 已刪除'); go('selfAware'); break;
    case 'toggle-need': {
      const i = formSelfAware.needs.indexOf(value);
      if(i>=0) formSelfAware.needs.splice(i,1); else formSelfAware.needs.push(value);
      render();
      break;
    }
    case 'save-selfaware': {
      if(formSelfAware.id) SelfAwarenessManager.update(formSelfAware.id, formSelfAware);
      else SelfAwarenessManager.add(formSelfAware);
      showGentleMessage('selfaware');
      go('selfAware');
      break;
    }

    /* ---- V1.8: 情緒紀錄 ---- */
    case 'emotion-range': emotionUI.range = value; render(); break;
    case 'emotion-edit': {
      const em = EmotionManager.get(id);
      if(em){ formEmotion = Object.assign(defaultFormEmotion(), em); go('emotionForm'); }
      break;
    }
    case 'emotion-delete': EmotionManager.delete(id); toast('🗑️ 已刪除'); go('emotion'); break;
    case 'add-emotion-type': {
      if(!newEmotionLabel.trim()){ toast('請輸入情緒名稱'); break; }
      const t = EmotionManager.addCustomType(newEmotionLabel.trim(), '✨');
      formEmotion.emotion = t.v;
      newEmotionLabel = '';
      render();
      break;
    }
    case 'save-emotion': {
      if(formEmotion.id) EmotionManager.update(formEmotion.id, formEmotion);
      else EmotionManager.add(formEmotion);
      showGentleMessage('emotion');
      go('emotion');
      break;
    }

    /* ---- V1.8: 放鬆中心 ---- */
    case 'relax-start': startRelaxCenter(value); break;
    case 'relax-cancel': cancelRelaxCenter(); break;
    case 'relax-feel': {
      RelaxManager.add({ durationKey: relaxUI.duration, feel: value });
      showGentleMessage('relax');
      go('relaxHub');
      break;
    }

    /* ---- V1.8: 正念 ---- */
    case 'mindful-start': {
      mindfulUI = { type:value, step:0, timerId:null, elapsed:0, fiveSenseAnswers:{ see:'', touch:'', hear:'', smell:'', tell:'' } };
      go('mindfulnessRun');
      break;
    }
    case 'mindful-next': {
      if(mindfulUI.type==='fiveSense'){ mindfulUI.step++; render(); break; }
      const lines = mindfulUI.type==='oneMin' ? MINDFULNESS_ONEMIN_LINES : BODY_SCAN_PARTS.map(p=>p.text);
      if(mindfulUI.step >= lines.length-1) finishMindfulness();
      else { mindfulUI.step++; render(); }
      break;
    }
    case 'mindful-finish': finishFiveSense(); break;

    /* ---- V1.8: WOOP ---- */
    case 'woop-new': formWoop = defaultFormWoop(); woopUI = { step:0 }; go('woopWizard'); break;
    case 'woop-example': {
      const ex = WOOP_EXAMPLES[Number(value)];
      formWoop = Object.assign(defaultFormWoop(), { wish:ex.wish, outcome:ex.outcome, obstacle:ex.obstacle, ifPart:ex.ifPart, thenPart:ex.thenPart });
      woopUI = { step:0 };
      go('woopWizard');
      break;
    }
    case 'woop-view': go('woopDetail', { id }); break;
    case 'woop-prev': woopUI.step = Math.max(0, woopUI.step-1); render(); break;
    case 'woop-next':
      if(woopUI.step >= WOOP_STEPS.length-1) woopFinishStep();
      else { woopUI.step++; render(); }
      break;
    case 'woop-edit': {
      const w = WoopManager.get(id);
      if(w){ formWoop = Object.assign(defaultFormWoop(), w); woopUI = { step:0 }; go('woopWizard'); }
      break;
    }
    case 'woop-duplicate': {
      formWoop = Object.assign(defaultFormWoop(), formWoop, { id:null, date:TaskManager.todayDateStr() });
      woopUI = { step:0 };
      go('woopWizard');
      break;
    }
    case 'woop-duplicate-id': {
      const w = WoopManager.get(id);
      if(w){ formWoop = Object.assign(defaultFormWoop(), w, { id:null, date:TaskManager.todayDateStr() }); woopUI = { step:0 }; go('woopWizard'); }
      break;
    }
    case 'woop-delete': WoopManager.delete(id); toast('🗑️ 已刪除'); go('woop'); break;

    /* ---- V2.3: 學習工具箱 / SWOT ---- */
    case 'tool-soon': toast('這個工具還在準備中，敬請期待。'); break;
    case 'swot-new': formSwot = defaultFormSwot(); go('swotForm'); break;
    case 'swot-view': go('swotDetail', { id }); break;
    case 'swot-edit': {
      const s = SwotManager.get(id);
      if(s){ formSwot = Object.assign(defaultFormSwot(), s); go('swotForm'); }
      break;
    }
    case 'swot-duplicate': {
      const s = SwotManager.get(id);
      if(s){ formSwot = Object.assign(defaultFormSwot(), s, { id:null, date:TaskManager.todayDateStr() }); go('swotForm'); }
      break;
    }
    case 'swot-delete': SwotManager.delete(id); toast('🗑️ 已刪除'); go('swot'); break;
    case 'save-swot': {
      if(formSwot.id) SwotManager.update(formSwot.id, formSwot);
      else SwotManager.add(formSwot);
      showGentleMessage('save');
      go('swot');
      break;
    }

    /* ---- V2.3 第三批: 5W1H ---- */
    case 'fiveW-new': formFiveWOneH = defaultFormFiveWOneH(); go('fiveWOneHForm'); break;
    case 'fiveW-view': go('fiveWOneHDetail', { id }); break;
    case 'fiveW-edit': {
      const r = FiveWOneHManager.get(id);
      if(r){ formFiveWOneH = Object.assign(defaultFormFiveWOneH(), r); go('fiveWOneHForm'); }
      break;
    }
    case 'fiveW-duplicate': {
      const r = FiveWOneHManager.get(id);
      if(r){ formFiveWOneH = Object.assign(defaultFormFiveWOneH(), r, { id:null, date:TaskManager.todayDateStr() }); go('fiveWOneHForm'); }
      break;
    }
    case 'fiveW-delete': FiveWOneHManager.delete(id); toast('🗑️ 已刪除'); go('fiveWOneH'); break;
    case 'save-fiveW': {
      if(formFiveWOneH.id) FiveWOneHManager.update(formFiveWOneH.id, formFiveWOneH);
      else FiveWOneHManager.add(formFiveWOneH);
      showGentleMessage('save');
      go('fiveWOneH');
      break;
    }

    /* ---- V2.3 第三批: PDCA ---- */
    case 'pdca-new': formPdca = defaultFormPdca(); go('pdcaForm'); break;
    case 'pdca-view': go('pdcaDetail', { id }); break;
    case 'pdca-edit': {
      const r = PdcaManager.get(id);
      if(r){ formPdca = Object.assign(defaultFormPdca(), r); go('pdcaForm'); }
      break;
    }
    case 'pdca-duplicate': {
      const r = PdcaManager.get(id);
      if(r){ formPdca = Object.assign(defaultFormPdca(), r, { id:null, date:TaskManager.todayDateStr() }); go('pdcaForm'); }
      break;
    }
    case 'pdca-delete': PdcaManager.delete(id); toast('🗑️ 已刪除'); go('pdca'); break;
    case 'save-pdca': {
      if(formPdca.id) PdcaManager.update(formPdca.id, formPdca);
      else PdcaManager.add(formPdca);
      showGentleMessage('save');
      go('pdca');
      break;
    }

    /* ---- V2.3 第三批: 艾森豪威爾矩陣 ---- */
    case 'eisenhower-set': {
      if(field==='important') TaskManager.setImportant(id, value==='1');
      else if(field==='urgent') TaskManager.setUrgent(id, value==='1');
      render();
      break;
    }
    case 'eisenhower-add': {
      const q = EISENHOWER_QUADRANTS.find(x=>x.key===value);
      formAdd = defaultFormAdd();
      if(q){ formAdd.important = q.important; formAdd.urgent = q.urgent; }
      go('add');
      break;
    }

    /* ---- V2.4: 被打斷詳細記錄 ---- */
    case 'interrupt-new': formInterruption = defaultFormInterruption(); go('interruptionForm'); break;
    case 'interrupt-edit': {
      const x = InterruptionManager.get(id);
      if(x){ formInterruption = Object.assign(defaultFormInterruption(), x); go('interruptionForm'); }
      break;
    }
    case 'interrupt-delete': InterruptionManager.delete(id); toast('🗑️ 已刪除'); go('interruptions'); break;
    case 'save-interruption': {
      if(formInterruption.id) InterruptionManager.update(formInterruption.id, formInterruption);
      else InterruptionManager.add(formInterruption);
      showGentleMessage('save');
      go('interruptions');
      break;
    }
    case 'toggle-home-section': {
      Store.data.settings.homeSections[value] = !Store.data.settings.homeSections[value];
      Store.save();
      render();
      break;
    }

    /* ---- V2.2: 抽卡（分類 + 500+ 卡） ---- */
    case 'card-mode-pick': {
      cardUI = { stage:'focus', category:value, question:'', drawnAnswer:null };
      go('cardDraw');
      break;
    }
    case 'card-to-choose': cardUI.stage = 'choose'; render(); break;
    case 'card-pick': {
      const a = CardManager.draw(cardUI.category);
      cardUI.drawnAnswer = a;
      cardUI.stage = 'reveal';
      formCardReflect = { understanding:'', feeling:5, laterResult:'' };
      render();
      break;
    }
    case 'card-again': cardUI.stage = 'choose'; cardUI.drawnAnswer = null; render(); break;
    case 'card-save': doCardSave(); break;
    case 'card-delete': CardManager.draws.delete(id); toast('🗑️ 已刪除'); go('cardHistory'); break;
    case 'card-edit-reflection': go('cardEditReflection', { id }); break;
    case 'card-save-reflection': {
      const u = document.getElementById('cardEditUnderstanding');
      const l = document.getElementById('cardEditLaterResult');
      CardManager.draws.update(id, { understanding: u?u.value:'', laterResult: l?l.value:'' });
      toast('✓ 已儲存');
      go('cardHistory');
      break;
    }
    case 'card-manage-filter': cardManageUI.category = value; render(); break;
    case 'card-toggle-active': CardManager.toggleAnswer(id); render(); break;
    case 'card-add-save': {
      if(!formCardAdd.text.trim()){ toast('請輸入卡片內容'); break; }
      CardManager.addAnswer(formCardAdd.text, formCardAdd.category, formCardAdd.note);
      toast('✓ 已加入我的卡片');
      formCardAdd = { text:'', category:'today', note:'' };
      go('cardManage');
      break;
    }

    /* ---- V2.2 第二批: 生活英文 ---- */
    case 'eng-status': EnglishManager.setStatus(id, value); showGentleMessage('save'); render(); break;
    case 'eng-favorite': EnglishManager.toggleFavorite(id); render(); break;
    case 'eng-speak': { const it = EnglishManager.getItem(id); if(it) speakEnglish(it.en); break; }
    case 'eng-set-daily': Store.data.englishSettings.dailyCount = Number(value); Store.save(); render(); break;
    case 'eng-open-list': {
      englishUI = { search:'', category:'all', mode:value };
      go('englishList');
      break;
    }
    case 'eng-filter': englishUI.category = value; UI.refreshEnglishList(); render(); break;
    case 'eng-edit': {
      const it = EnglishManager.getItem(id);
      if(it){ formEnglishAdd = Object.assign(defaultFormEnglishAdd(), it); go('englishAddForm'); }
      break;
    }
    case 'eng-delete': EnglishManager.deleteCustom(id); toast('🗑️ 已刪除'); go('englishHub'); break;
    case 'eng-add-save': {
      if(!formEnglishAdd.en.trim() || !formEnglishAdd.zh.trim()){ toast('請至少填寫 English 與中文'); break; }
      if(formEnglishAdd.id) EnglishManager.updateCustom(formEnglishAdd.id, formEnglishAdd);
      else EnglishManager.addCustom(formEnglishAdd);
      showGentleMessage('save');
      formEnglishAdd = defaultFormEnglishAdd();
      go('englishHub');
      break;
    }
  }
});

/* ============================ App init ============================ */
function seedDemoIfNeeded(){
  if(Store.data.settings.demoSeeded || Store.data.tasks.length>0) return;
  Store.data.uidCounter = 1;
  const mk = (content, source, priority, deadlineType, opt) => {
    const t = TaskManager.createTask(Object.assign({ content, source, priority, deadlineType }, opt||{}));
    return t;
  };
  const t1 = mk('今日回報整理','boss','urgent','today',{ time:'15:00' });
  const t2 = mk('整理資料','unit','normal','today',{ time:'17:00' });
  const t3 = mk('等待相關資料','colleague','normal','none');
  TaskManager.setStatus(t3.id,'waiting');
  TaskManager.setWaiting(t3.id,'等待相關資料','today');
  const t4 = mk('明日文件整理','self','low','tomorrow');
  Store.data.settings.demoSeeded = true;
  Store.save();
}
function registerServiceWorker(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(function(){ /* not available in this context, safe to ignore */ });
  }
}
function initApp(){
  Store.load();
  seedDemoIfNeeded();
  CardManager.ensureSeeded();
  EnglishManager.ensureSeeded();
  applyTheme();
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){
      if(Store.data.settings.theme==='system') applyTheme();
    });
  }
  render();
  registerServiceWorker();
}
initApp();
</script>
